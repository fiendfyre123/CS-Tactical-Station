<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>BLACKOUT 战术行动</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0d0f13; touch-action: none; }
  body { font-family: 'Noto Sans SC', sans-serif; color: #c8ccd4; cursor: none; user-select: none; }
  #game { display: block; position: absolute; inset: 0; }
  .hidden { display: none !important; }

  #damage-flash { position: absolute; inset: 0; pointer-events: none; z-index: 5; background: radial-gradient(ellipse at center, transparent 45%, rgba(180, 30, 30, 0.55) 100%); opacity: 0; transition: opacity 0.35s ease-out; }
  #damage-flash.show { opacity: 1; transition: none; }
  #pickup-flash { position: absolute; inset: 0; pointer-events: none; z-index: 6; background: radial-gradient(ellipse at center, rgba(255, 184, 0, 0.3) 0%, transparent 60%); opacity: 0; transition: opacity 0.5s ease-out; }
  #pickup-flash.show { opacity: 1; transition: none; }
  #vignette { position: absolute; inset: 0; pointer-events: none; z-index: 4; background: radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, 0.7) 100%); }

  #hud { position: absolute; inset: 0; pointer-events: none; z-index: 10; }
  .hud-top { position: absolute; top: 14px; left: 0; right: 0; display: flex; justify-content: space-between; padding: 0 16px; gap: 8px; }
  .hud-top > div { background: rgba(15, 17, 22, 0.88); border-left: 3px solid #d4a017; padding: 5px 14px 6px; min-width: 90px; backdrop-filter: blur(6px); }
  .hud-top .right { border-left: none; border-right: 3px solid #c41e3a; text-align: right; }
  .hud-top .center { border-left: none; border-bottom: 2px solid #4a6a8a; text-align: center; }
  .hud-top .center .value { color: #6a8aaa; }
  .label { font-size: 9px; letter-spacing: 0.2em; color: #6b7280; font-weight: 700; }
  .value { font-family: 'JetBrains Mono', monospace; font-size: 20px; color: #e4b041; margin-top: 1px; line-height: 1; }
  .value.danger { color: #ff5252; }
  .value.info { color: #6a8aaa; }

  .hud-bl { position: absolute; bottom: 18px; left: 16px; width: 320px; }
  .level-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 3px; }
  .lvl-text { font-weight: 900; font-size: 13px; color: #ffb800; letter-spacing: 0.1em; }
  .lvl-text span { font-family: 'JetBrains Mono'; font-size: 16px; }
  .xp-text { font-family: 'JetBrains Mono'; font-size: 10px; color: #8a7a40; }
  .xp-bar { height: 5px; background: rgba(0,0,0,0.6); border: 1px solid rgba(255,184,0,0.3); margin-bottom: 8px; overflow: hidden; }
  .xp-fill { height: 100%; background: linear-gradient(90deg, #ff8800, #ffb800, #ffd84a); width: 0%; transition: width 0.2s ease; }
  .hp-block { background: rgba(15, 17, 22, 0.88); border-left: 3px solid #c41e3a; padding: 8px 12px; backdrop-filter: blur(6px); }
  .hp-label { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 5px; }
  .hp-text { font-family: 'JetBrains Mono'; font-weight: 700; font-size: 13px; color: #ff5252; }
  .hp-bar { height: 12px; background: rgba(0,0,0,0.7); border: 1px solid rgba(196,30,58,0.4); overflow: hidden; position: relative; }
  .hp-fill { height: 100%; background: linear-gradient(90deg, #6b0e1e, #c41e3a, #e23636); width: 100%; transition: width 0.2s ease; }
  .hp-tick { position: absolute; top: 0; bottom: 0; width: 1px; background: rgba(0,0,0,0.4); }
  .skills-row { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 6px; max-width: 320px; }
  .skill-chip { background: rgba(15, 17, 22, 0.88); border: 1px solid #4a6a8a; padding: 2px 7px; font-size: 10px; color: #6a8aaa; letter-spacing: 0.05em; font-family: 'JetBrains Mono'; }
  .skill-chip.epic { border-color: #8a4aaa; color: #b347d9; }
  .skill-chip.legendary { border-color: #ffb800; color: #ffb800; }

  .hud-br { position: absolute; bottom: 18px; right: 16px; }
  .weapon-block { background: rgba(15, 17, 22, 0.88); border-right: 3px solid #d4a017; padding: 8px 14px; text-align: right; min-width: 180px; position: relative; backdrop-filter: blur(6px); }
  .weapon-name { font-weight: 900; font-size: 15px; color: #e4b041; letter-spacing: 0.05em; }
  .weapon-upgrades { font-size: 10px; color: #6b7280; margin-top: 1px; font-family: 'JetBrains Mono'; }
  .ammo { font-family: 'JetBrains Mono'; font-weight: 700; font-size: 26px; margin-top: 2px; color: #f0d060; line-height: 1; }
  .ammo-sep { color: #4a4030; margin: 0 4px; font-weight: 400; }
  .ammo-low { color: #ff5252; }
  .ammo-infinite { color: #b347d9; font-size: 22px; }
  .reload-hint { position: absolute; top: -20px; right: 4px; font-size: 10px; letter-spacing: 0.2em; color: #ff7a18; font-weight: 700; opacity: 0; transition: opacity 0.15s; }
  .reload-hint.show { opacity: 1; animation: blink 0.5s infinite alternate; }
  @keyframes blink { to { opacity: 0.3; } }
  .weapon-switch-hint { position: absolute; top: -20px; left: 4px; font-size: 10px; letter-spacing: 0.15em; color: #6a8aaa; font-weight: 700; }

  #killfeed { position: absolute; top: 80px; right: 16px; z-index: 11; pointer-events: none; display: flex; flex-direction: column; gap: 3px; align-items: flex-end; }
  .kill-item { background: rgba(15, 17, 22, 0.88); border-right: 2px solid #d4a017; padding: 3px 10px; font-family: 'JetBrains Mono'; font-size: 11px; color: #e4b041; animation: killSlide 0.3s ease-out; }
  @keyframes killSlide { from { transform: translateX(40px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  .kill-item.fade { animation: killFade 0.5s ease-out forwards; }
  @keyframes killFade { to { opacity: 0; transform: translateX(40px); } }

  #crate-hint { position: absolute; top: 80px; left: 16px; z-index: 11; pointer-events: none; display: flex; flex-direction: column; gap: 3px; }
  .crate-item { background: rgba(15, 17, 22, 0.88); border-left: 2px solid; padding: 3px 10px; font-family: 'JetBrains Mono'; font-size: 11px; letter-spacing: 0.05em; animation: crateSlide 0.3s ease-out; }
  @keyframes crateSlide { from { transform: translateX(-40px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  .crate-item.weapon { border-color: #d4a017; color: #d4a017; }
  .crate-item.skill { border-color: #b347d9; color: #b347d9; }
  .crate-item .dist { color: #6b7280; font-size: 9px; margin-left: 5px; }

  /* 暂停按钮 */
  #pause-btn { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); z-index: 12; pointer-events: auto; display: none; }
  #pause-btn.active { display: block; }
  #pause-btn button { background: rgba(15, 17, 22, 0.88); border: 1px solid #4a6a8a; color: #6a8aaa; width: 36px; height: 36px; font-size: 14px; cursor: pointer; font-family: 'Noto Sans SC'; }
  #pause-btn button:active { background: rgba(74, 106, 138, 0.3); }

  /* 暂停遮罩 */
  #pause-overlay { position: absolute; inset: 0; z-index: 25; background: rgba(8, 10, 14, 0.85); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; cursor: default; }
  .pause-content { text-align: center; }
  .pause-title { font-size: 48px; font-weight: 900; color: #d4a017; letter-spacing: 0.1em; margin-bottom: 20px; }
  .pause-btn-row { display: flex; gap: 12px; justify-content: center; }

  /* 升级面板 */
  #levelup { position: absolute; inset: 0; z-index: 30; background: rgba(8, 10, 14, 0.82); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; flex-direction: column; cursor: default; padding: 20px; }
  #levelup.show { animation: fadeIn 0.3s ease-out; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .lv-header { text-align: center; margin-bottom: 24px; }
  .lv-tag { font-size: 12px; letter-spacing: 0.4em; color: #ff7a18; font-weight: 700; }
  .lv-title { font-size: 42px; font-weight: 900; color: #ffb800; letter-spacing: 0.05em; text-shadow: 0 0 20px rgba(255, 184, 0, 0.4); line-height: 1.1; margin-top: 4px; }
  .lv-sub { font-family: 'JetBrains Mono'; font-size: 12px; color: #6b7280; margin-top: 6px; }
  .upgrade-cards { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; max-width: 800px; }
  .upgrade-card { width: 210px; height: 300px; background: linear-gradient(180deg, #1c1f26 0%, #15171c 100%); border: 1px solid #2a2e38; border-top: 3px solid #4a4a4a; padding: 20px 16px; cursor: pointer; display: flex; flex-direction: column; align-items: center; text-align: center; transition: all 0.2s ease; position: relative; overflow: hidden; }
  .upgrade-card::before { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 0%, rgba(255, 184, 0, 0.04) 100%); pointer-events: none; }
  .upgrade-card:hover { transform: translateY(-6px); border-color: #ffb800; box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6), 0 0 20px rgba(255, 184, 0, 0.15); }
  .upgrade-card.common { border-top-color: #8a92a6; }
  .upgrade-card.rare { border-top-color: #4a90e2; }
  .upgrade-card.epic { border-top-color: #b347d9; }
  .upgrade-card.legendary { border-top-color: #ffb800; }
  .uc-rarity { font-size: 10px; letter-spacing: 0.3em; font-weight: 700; margin-bottom: 14px; text-transform: uppercase; }
  .upgrade-card.common .uc-rarity { color: #8a92a6; }
  .upgrade-card.rare .uc-rarity { color: #4a90e2; }
  .upgrade-card.epic .uc-rarity { color: #b347d9; }
  .upgrade-card.legendary .uc-rarity { color: #ffb800; }
  .uc-icon { width: 70px; height: 70px; border: 2px solid currentColor; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono'; font-size: 24px; font-weight: 700; margin-bottom: 14px; transform: rotate(45deg); }
  .uc-icon > span { transform: rotate(-45deg); }
  .upgrade-card.common .uc-icon { color: #8a92a6; }
  .upgrade-card.rare .uc-icon { color: #4a90e2; }
  .upgrade-card.epic .uc-icon { color: #b347d9; }
  .upgrade-card.legendary .uc-icon { color: #ffb800; }
  .uc-name { font-size: 16px; font-weight: 900; color: #e8eaed; letter-spacing: 0.05em; margin-bottom: 8px; line-height: 1.2; }
  .uc-desc { font-size: 12px; color: #9aa0a8; line-height: 1.4; flex-grow: 1; }
  .uc-stack { font-family: 'JetBrains Mono'; font-size: 10px; color: #6b7280; margin-top: 10px; letter-spacing: 0.1em; }

  .overlay { position: absolute; inset: 0; z-index: 20; background: radial-gradient(ellipse at 25% 30%, rgba(212, 160, 23, 0.08) 0%, transparent 50%), radial-gradient(ellipse at 75% 70%, rgba(196, 30, 58, 0.06) 0%, transparent 50%), radial-gradient(ellipse at center, rgba(15, 17, 22, 0.92) 0%, rgba(8, 10, 14, 0.98) 70%); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; cursor: default; padding: 20px; }
  .menu-content { text-align: center; padding: 30px; max-width: 600px; }
  .title-bar { width: 50px; height: 3px; background: #d4a017; margin: 0 auto 18px; }
  .game-title { font-size: 76px; font-weight: 900; line-height: 0.9; letter-spacing: 0.04em; color: #e8eaed; }
  .game-title span { color: #d4a017; text-shadow: 0 0 24px rgba(212, 160, 23, 0.5); display: block; }
  .game-sub { font-family: 'JetBrains Mono'; font-size: 11px; letter-spacing: 0.3em; color: #6b7280; margin-top: 12px; }
  .controls-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin: 24px auto; max-width: 460px; }
  .ctrl { display: flex; align-items: center; gap: 10px; padding: 7px 12px; background: rgba(212, 160, 23, 0.04); border-left: 2px solid rgba(212, 160, 23, 0.3); }
  .ctrl kbd { font-family: 'JetBrains Mono'; font-weight: 700; font-size: 10px; background: rgba(212, 160, 23, 0.08); border: 1px solid rgba(212, 160, 23, 0.3); padding: 3px 9px; color: #d4a017; letter-spacing: 0.1em; min-width: 64px; text-align: center; }
  .ctrl span { font-size: 12px; color: #9aa0a8; }
  .cta-btn { font-family: 'Noto Sans SC'; font-weight: 900; font-size: 16px; letter-spacing: 0.18em; background: transparent; color: #d4a017; border: 2px solid #d4a017; padding: 14px 44px; cursor: pointer; position: relative; overflow: hidden; transition: color 0.3s, box-shadow 0.3s; margin-top: 4px; }
  .cta-btn::before { content: ''; position: absolute; inset: 0; background: #d4a017; transform: translateX(-101%); transition: transform 0.3s ease; z-index: 0; }
  .cta-btn > span { position: relative; z-index: 1; }
  .cta-btn:hover { color: #0d0f13; box-shadow: 0 0 30px rgba(212, 160, 23, 0.4); }
  .cta-btn:hover::before { transform: translateX(0); }
  .hint { margin-top: 18px; font-size: 12px; color: #4b5563; }
  .over-title { font-size: 64px; font-weight: 900; color: #c41e3a; letter-spacing: 0.05em; text-shadow: 0 0 24px rgba(196, 30, 58, 0.5); margin-bottom: 4px; }
  .over-sub { font-family: 'JetBrains Mono'; font-size: 11px; letter-spacing: 0.3em; color: #6b7280; margin-bottom: 26px; }
  .stats { display: flex; flex-direction: column; gap: 5px; margin: 18px 0 24px; align-items: center; }
  .stat { display: flex; justify-content: space-between; align-items: center; width: 340px; padding: 10px 18px; background: rgba(196, 30, 58, 0.04); border-left: 2px solid rgba(196, 30, 58, 0.3); }
  .stat-label { font-size: 11px; letter-spacing: 0.18em; color: #6b7280; font-weight: 700; }
  .stat-value { font-family: 'JetBrains Mono'; font-weight: 700; font-size: 20px; color: #e23636; }

  /* 手机固定摇杆 */
  #mobile-ui { position: absolute; inset: 0; z-index: 15; pointer-events: none; display: none; }
  #mobile-ui.active { display: block; }
  .joystick-base { position: absolute; width: 120px; height: 120px; border: 2px solid rgba(212, 160, 23, 0.35); border-radius: 50%; background: rgba(15, 17, 22, 0.25); pointer-events: none; }
  .joystick-stick { position: absolute; width: 50px; height: 50px; border: 2px solid rgba(212, 160, 23, 0.8); background: rgba(212, 160, 23, 0.3); border-radius: 50%; pointer-events: none; }
  .joystick-base.right { border-color: rgba(196, 30, 58, 0.35); }
  .joystick-stick.right { border-color: rgba(196, 30, 58, 0.8); background: rgba(196, 30, 58, 0.3); }
  #reload-mobile { position: absolute; bottom: 160px; right: 16px; width: 56px; height: 56px; background: rgba(15, 17, 22, 0.85); border: 2px solid #d4a017; color: #d4a017; font-weight: 900; font-size: 11px; border-radius: 50%; pointer-events: auto; cursor: pointer; font-family: 'Noto Sans SC'; }
  #reload-mobile:active { background: rgba(212, 160, 23, 0.3); }
  #switch-mobile { position: absolute; bottom: 160px; left: 16px; width: 56px; height: 56px; background: rgba(15, 17, 22, 0.85); border: 2px solid #4a6a8a; color: #6a8aaa; font-weight: 900; font-size: 11px; border-radius: 50%; pointer-events: auto; cursor: pointer; font-family: 'Noto Sans SC'; }
  #switch-mobile:active { background: rgba(74, 106, 138, 0.3); }

  /* 竖屏提示 */
  #rotate-hint { position: absolute; inset: 0; z-index: 100; background: #0d0f13; display: none; align-items: center; justify-content: center; text-align: center; padding: 30px; }
  #rotate-hint.show { display: flex; }
  .rotate-icon { font-size: 48px; margin-bottom: 16px; animation: rotateAnim 2s infinite ease-in-out; }
  @keyframes rotateAnim { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(90deg); } }
  .rotate-text { font-size: 16px; color: #d4a017; font-weight: 700; letter-spacing: 0.1em; }
</style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="vignette"></div>
  <div id="damage-flash"></div>
  <div id="pickup-flash"></div>

  <div id="hud" class="hidden">
    <div class="hud-top">
      <div><div class="label">得分</div><div class="value" id="score">0</div></div>
      <div class="center"><div class="label">波次</div><div class="value info" id="wave">1</div></div>
      <div class="right"><div class="label">敌人</div><div class="value danger" id="enemies">0</div></div>
    </div>

    <div id="pause-btn"><button id="pause-toggle">‖</button></div>
    <div id="killfeed"></div>
    <div id="crate-hint"></div>

    <div class="hud-bl">
      <div class="level-row"><span class="lvl-text">等级 <span id="lvl">1</span></span><span class="xp-text" id="xp-text">0 / 50</span></div>
      <div class="xp-bar"><div class="xp-fill" id="xp-fill"></div></div>
      <div class="hp-block">
        <div class="hp-label"><span class="label">生命</span><span class="hp-text" id="hp-text">100/100</span></div>
        <div class="hp-bar"><div class="hp-fill" id="hp-fill"></div><div class="hp-tick" style="left: 25%"></div><div class="hp-tick" style="left: 50%"></div><div class="hp-tick" style="left: 75%"></div></div>
      </div>
      <div class="skills-row" id="skills-row"></div>
    </div>

    <div class="hud-br">
      <div class="weapon-block">
        <div class="reload-hint" id="reload-hint">装弹中</div>
        <div class="weapon-switch-hint" id="weapon-switch-hint">按 Q 切换</div>
        <div class="weapon-name" id="weapon-name">GLOCK-18</div>
        <div class="weapon-upgrades" id="weapon-upgrades">等级 1 / 5</div>
        <div class="ammo" id="ammo-display"><span id="ammo-mag">12</span><span class="ammo-sep">/</span><span id="ammo-mag-max">12</span></div>
      </div>
    </div>
  </div>

  <div id="mobile-ui">
    <div class="joystick-base" id="move-base" style="left: 30px; bottom: 30px; display: none;"></div>
    <div class="joystick-stick" id="move-stick" style="left: 65px; bottom: 65px; display: none;"></div>
    <div class="joystick-base right" id="aim-base" style="right: 30px; bottom: 30px; display: none;"></div>
    <div class="joystick-stick right" id="aim-stick" style="right: 65px; bottom: 65px; display: none;"></div>
    <button id="reload-mobile">装弹</button>
    <button id="switch-mobile">切刀</button>
  </div>

  <div id="pause-overlay" class="hidden">
    <div class="pause-content">
      <div class="pause-title">暂停</div>
      <div class="pause-btn-row">
        <button class="cta-btn" id="resume-btn"><span>继续</span></button>
      </div>
    </div>
  </div>

  <div id="rotate-hint">
    <div>
      <div class="rotate-icon">📱</div>
      <div class="rotate-text">请横屏游玩</div>
    </div>
  </div>

  <div id="levelup" class="hidden">
    <div class="lv-header">
      <div class="lv-tag" id="lv-tag">升级</div>
      <div class="lv-title" id="lv-title">等级 2</div>
      <div class="lv-sub" id="lv-sub">选择一项强化部署</div>
    </div>
    <div class="upgrade-cards" id="upgrade-cards"></div>
  </div>

  <div id="menu" class="overlay">
    <div class="menu-content">
      <div class="title-bar"></div>
      <h1 class="game-title">战术<span>行動</span></h1>
      <p class="game-sub">BLACKOUT · 无限波次 · v6.0</p>
      <div class="controls-grid">
        <div class="ctrl"><kbd>W A S D</kbd><span>战术移动</span></div>
        <div class="ctrl"><kbd>鼠标</kbd><span>瞄准方向</span></div>
        <div class="ctrl"><kbd>左键</kbd><span>开火</span></div>
        <div class="ctrl"><kbd>R</kbd><span>装弹</span></div>
        <div class="ctrl"><kbd>Q</kbd><span>切换小刀</span></div>
        <div class="ctrl"><kbd>ESC</kbd><span>暂停</span></div>
      </div>
      <button id="start-btn" class="cta-btn"><span>出击</span></button>
      <div class="hint">手机端：左下摇杆移动 · 右下摇杆瞄准开火 · 切刀/装弹按钮在两侧</div>
    </div>
  </div>

  <div id="gameover" class="overlay hidden">
    <div class="menu-content">
      <h1 class="over-title">阵亡</h1>
      <p class="over-sub">KIA · 任务失败</p>
      <div class="stats">
        <div class="stat"><span class="stat-label">最终得分</span><span class="stat-value" id="final-score">0</span></div>
        <div class="stat"><span class="stat-label">抵达波次</span><span class="stat-value" id="final-wave">1</span></div>
        <div class="stat"><span class="stat-label">角色等级</span><span class="stat-value" id="final-lvl">1</span></div>
        <div class="stat"><span class="stat-label">总击杀</span><span class="stat-value" id="final-kills">0</span></div>
      </div>
      <button id="restart-btn" class="cta-btn"><span>重新出击</span></button>
    </div>
  </div>

<script>
// ===================== 工具 =====================
const rand = (a, b) => Math.random() * (b - a) + a;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const TAU = Math.PI * 2;

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; updateJoystickPositions(); }
window.addEventListener('resize', resize);
resize();

const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
if (isTouch) {
  document.getElementById('mobile-ui').classList.add('active');
  document.body.style.cursor = 'default';
}

// 竖屏检测
function checkOrientation() {
  const hint = document.getElementById('rotate-hint');
  if (isTouch && window.innerHeight > window.innerWidth) {
    hint.classList.add('show');
  } else {
    hint.classList.remove('show');
  }
}
window.addEventListener('orientationchange', checkOrientation);
window.addEventListener('resize', checkOrientation);
checkOrientation();

// ===================== Player =====================
class Player {
  constructor(x, y) {
    this.x = x; this.y = y; this.radius = 13;
    this.baseSpeed = 3.0;
    this.angle = 0;
    this.hp = 100; this.maxHp = 100;
    this.level = 1; this.xp = 0; this.xpToNext = 50; this.kills = 0;
    this.weaponKey = 'glock'; this.weaponTier = 1;
    this.ammo = WEAPONS.glock.magSize;
    this.fireTimer = 0; this.reloadTimer = 0;
    this.invuln = 0; this.muzzleFlash = 0; this.recoilOffset = 0; this.canFire = true;
    this.speedMult = 1; this.damageMult = 1; this.fireRateMult = 1;
    this.magMult = 1; this.reloadMult = 1; this.bulletSpeedMult = 1;
    this.spreadMult = 1; this.pickupRangeMult = 1; this.xpMult = 1;
    this.dropLuck = 1; this.critChance = 0; this.critMult = 1.75;
    this.regen = 0; this.lifesteal = 0; this.thorns = 0; this.rage = false;
    this.regenAcc = 0;
    this.skills = new Set();
    this.extraShots = 0; this.pierceBonus = 0;
    this.takenUpgrades = {};
    this.moveDir = { x: 0, y: 0 };
    this.activeWeapon = 'primary';
    this.knifeTimer = 0;
    this.knifeSlash = 0;
  }
  get weapon() { return WEAPONS[this.weaponKey]; }
  get weaponMods() { return WEAPON_UPGRADE_TREE[this.weaponTier]; }
  get speed() { return this.baseSpeed * this.speedMult * (this.rage && this.hp < this.maxHp * 0.35 ? 1.4 : 1); }
  get effectiveDamageMult() { return this.damageMult * this.weaponMods.damage * (this.rage && this.hp < this.maxHp * 0.35 ? 1.4 : 1); }
  get effectiveFireRate() { return Math.max(1, Math.floor(this.weapon.fireRate * this.fireRateMult * this.weaponMods.fireRate)); }
  get effectiveMag() { return Math.floor(this.weapon.magSize * this.magMult * this.weaponMods.magSize); }
  get effectiveReload() { return Math.floor(this.weapon.reloadTime * this.reloadMult); }
  get effectiveSpread() { return this.weapon.spread * this.spreadMult * this.weaponMods.spread; }
  get effectiveBulletSpeed() { return this.weapon.bulletSpeed * this.bulletSpeedMult * this.weaponMods.bulletSpeed; }
  get knifeDamage() { return 100 + (this.level - 1) * 25; }
  get hasInfiniteAmmo() { return this.skills.has('infammo'); }
  get hasInfiniteRange() { return this.skills.has('infrange'); }
  get hasSplit() { return this.skills.has('split'); }
  get hasHoming() { return this.skills.has('homing'); }
  get hasBoomerang() { return this.skills.has('boomerang'); }
  get hasBounce() { return this.skills.has('bounce'); }
  get hasShock() { return this.skills.has('shock'); }
  get hasChain() { return this.skills.has('chain'); }
  get hasMulti() { return this.skills.has('multishot'); }
  get hasPoison() { return this.skills.has('poison'); }
  get hasFreeze() { return this.skills.has('freeze'); }

  switchWeapon() {
    this.activeWeapon = this.activeWeapon === 'primary' ? 'knife' : 'primary';
    this.fireTimer = 0; this.canFire = true; this.reloadTimer = 0;
  }

  update() {
    let dx = 0, dy = 0;
    if (game.keys['w'] || game.keys['arrowup']) dy -= 1;
    if (game.keys['s'] || game.keys['arrowdown']) dy += 1;
    if (game.keys['a'] || game.keys['arrowleft']) dx -= 1;
    if (game.keys['d'] || game.keys['arrowright']) dx += 1;
    if (touchState.move.active) {
      const len = Math.hypot(touchState.move.dx, touchState.move.dy);
      if (len > 8) { dx = touchState.move.dx / len; dy = touchState.move.dy / len; }
    }
    if (dx !== 0 || dy !== 0) {
      const len = Math.hypot(dx, dy);
      dx /= len; dy /= len;
      this.x += dx * this.speed;
      this.y += dy * this.speed;
      this.moveDir = { x: dx, y: dy };
      if (game.time % 6 === 0) {
        game.particles.push(new Particle(this.x - dx * 10 + rand(-2, 2), this.y - dy * 10 + rand(-2, 2), rand(-0.3, 0.3), rand(-0.3, 0.3), 16, '#4a4a45', 1.4));
      }
    }
    this.x = clamp(this.x, this.radius, canvas.width - this.radius);
    this.y = clamp(this.y, this.radius, canvas.height - this.radius);

    if (touchState.aim.active) {
      const len = Math.hypot(touchState.aim.dx, touchState.aim.dy);
      if (len > 8) this.angle = Math.atan2(touchState.aim.dy, touchState.aim.dx);
    } else {
      this.angle = Math.atan2(game.mouse.y - this.y, game.mouse.x - this.x);
    }

    if (this.reloadTimer > 0 && !this.hasInfiniteAmmo && this.activeWeapon === 'primary') {
      this.reloadTimer--;
      if (this.reloadTimer === 0) this.ammo = this.effectiveMag;
    }
    if (this.regen > 0 && this.hp < this.maxHp) {
      this.regenAcc += this.regen / 60;
      if (this.regenAcc >= 1) {
        this.hp = Math.min(this.maxHp, this.hp + Math.floor(this.regenAcc));
        this.regenAcc -= Math.floor(this.regenAcc);
      }
    }
    if (this.fireTimer > 0) this.fireTimer--;
    if (this.muzzleFlash > 0) this.muzzleFlash--;
    if (this.recoilOffset > 0) this.recoilOffset *= 0.7;
    if (this.invuln > 0) this.invuln--;
    if (this.knifeSlash > 0) this.knifeSlash--;

    const firing = game.mouse.down || touchState.aim.active;
    if (firing && this.fireTimer <= 0 && this.reloadTimer <= 0) {
      if (this.activeWeapon === 'knife') {
        if (this.canFire) { this.fireKnife(); this.canFire = false; }
      } else {
        if (this.hasInfiniteAmmo || this.ammo > 0) {
          if (this.weapon.auto || this.canFire) { this.firePrimary(); this.canFire = false; }
        } else this.startReload();
      }
    }
    if (!firing) this.canFire = true;
  }

  fireKnife() {
    this.fireTimer = 22;
    this.knifeSlash = 10;
    const range = this.radius + 40;
    const halfAngle = Math.PI / 3;
    const dmg = this.knifeDamage;

    for (const e of game.enemies) {
      if (e.dead || e.spawnAnim > 0) continue;
      const dx = e.x - this.x;
      const dy = e.y - this.y;
      const d = Math.hypot(dx, dy);
      if (d < range + e.radius) {
        const angleToE = Math.atan2(dy, dx);
        let diff = angleToE - this.angle;
        while (diff > Math.PI) diff -= TAU;
        while (diff < -Math.PI) diff += TAU;
        if (Math.abs(diff) < halfAngle) {
          e.takeDamage(dmg);
          const knockback = 10;
          e.x += Math.cos(angleToE) * knockback;
          e.y += Math.sin(angleToE) * knockback;
          for (let i = 0; i < 8; i++) {
            const a = angleToE + rand(-0.5, 0.5);
            const sp = rand(2, 5);
            game.particles.push(new Particle(e.x, e.y, Math.cos(a) * sp, Math.sin(a) * sp, 15, '#ff5252', rand(2, 3.5)));
          }
        }
      }
    }

    for (let i = 0; i < 15; i++) {
      const a = this.angle + rand(-halfAngle, halfAngle);
      const sp = rand(4, 9);
      const r = rand(5, range);
      game.particles.push(new Particle(
        this.x + Math.cos(a) * r * 0.3,
        this.y + Math.sin(a) * r * 0.3,
        Math.cos(a) * sp, Math.sin(a) * sp,
        10, i % 2 ? '#ffffff' : '#aaccff', rand(2, 4)
      ));
    }
    game.shake = Math.min(game.shake + 2, 6);
  }

  firePrimary() {
    const w = this.weapon;
    this.fireTimer = this.effectiveFireRate;
    if (!this.hasInfiniteAmmo) this.ammo--;
    this.muzzleFlash = 6;
    this.recoilOffset = w.recoil;
    const totalPellets = w.pellets + (this.hasMulti ? 2 : 0) + this.extraShots;
    for (let i = 0; i < totalPellets; i++) {
      const spread = (Math.random() - 0.5) * this.effectiveSpread * 2;
      const angle = this.angle + spread;
      const isCrit = Math.random() < (this.critChance + (this.skills.has('critmaster') ? 0.3 : 0));
      const dmg = w.damage * this.effectiveDamageMult * (isCrit ? (this.skills.has('critmaster') ? 2.5 : this.critMult) : 1);
      const bx = this.x + Math.cos(this.angle) * (this.radius + 18);
      const by = this.y + Math.sin(this.angle) * (this.radius + 18);
      const bullet = new Bullet(bx, by, angle, {
        damage: dmg, color: w.color, glow: w.color,
        bulletSpeed: this.effectiveBulletSpeed,
        size: w.size, life: this.hasInfiniteRange ? 99999 : Math.floor(w.life * this.weaponMods.bulletSpeed),
        pierce: this.pierceBonus + (w.pierce || 0) + (this.skills.has('pierce') ? 5 : 0),
        bounce: this.hasBounce ? 3 : 0, homing: this.hasHoming, boomerang: this.hasBoomerang,
        split: this.hasSplit, shock: this.hasShock, chain: this.hasChain,
        poison: this.hasPoison, freeze: this.hasFreeze
      }, 'player');
      bullet.crit = isCrit;
      game.bullets.push(bullet);
    }
    for (let i = 0; i < 5; i++) {
      const a = this.angle + rand(-0.3, 0.3); const sp = rand(2, 5);
      game.particles.push(new Particle(this.x + Math.cos(this.angle) * (this.radius + 18), this.y + Math.sin(this.angle) * (this.radius + 18), Math.cos(a) * sp, Math.sin(a) * sp, 9, '#ffcc66', rand(1.8, 3.2)));
    }
    for (let i = 0; i < 2; i++) {
      const a = this.angle + rand(-0.4, 0.4);
      game.particles.push(new Particle(this.x + Math.cos(this.angle) * (this.radius + 18), this.y + Math.sin(this.angle) * (this.radius + 18), Math.cos(a) * 0.4, Math.sin(a) * 0.4 - 0.3, 22, '#666670', rand(2, 3.5), 'smoke'));
    }
    const ea = this.angle + Math.PI / 2 + rand(-0.15, 0.15);
    game.particles.push(new Particle(this.x + Math.cos(this.angle) * 6, this.y + Math.sin(this.angle) * 6, Math.cos(ea) * 2.2 + rand(-0.4, 0.4), Math.sin(ea) * 2.2 - 1.4, 35, '#ccaa55', 1.8, 'shell'));
    game.shake = Math.min(game.shake + w.shake, 10);
    this.x -= Math.cos(this.angle) * w.recoil * 0.22;
    this.y -= Math.sin(this.angle) * w.recoil * 0.22;
  }

  startReload() {
    if (this.hasInfiniteAmmo) return;
    if (this.reloadTimer > 0) return;
    if (this.ammo >= this.effectiveMag) return;
    this.reloadTimer = this.effectiveReload;
  }

  takeDamage(amount, source) {
    if (this.invuln > 0) return;
    this.hp -= amount;
    this.invuln = 25;
    game.shake = Math.min(game.shake + 4, 12);
    if (this.thorns > 0 && source && !source.dead) source.takeDamage(amount * this.thorns, true);
    const flash = document.getElementById('damage-flash');
    flash.classList.remove('show'); void flash.offsetWidth;
    flash.classList.add('show');
    setTimeout(() => flash.classList.remove('show'), 350);
    for (let i = 0; i < 12; i++) {
      const a = rand(0, TAU); const sp = rand(1, 4);
      game.particles.push(new Particle(this.x, this.y, Math.cos(a) * sp, Math.sin(a) * sp, 25, '#aa3030', rand(1.8, 3)));
    }
    if (this.hp <= 0) { this.hp = 0; gameOver(); }
  }

  heal(amount) {
    this.hp = Math.min(this.maxHp, this.hp + amount);
    for (let i = 0; i < 10; i++) {
      const a = rand(0, TAU);
      game.particles.push(new Particle(this.x, this.y, Math.cos(a) * 1, Math.sin(a) * 1 - 1, 28, '#4ad45a', rand(1.8, 2.8)));
    }
  }

  addXP(amount) {
    this.xp += Math.floor(amount * this.xpMult);
    while (this.xp >= this.xpToNext) {
      this.xp -= this.xpToNext;
      this.level++;
      this.xpToNext = Math.floor(50 * Math.pow(1.35, this.level - 1));
      triggerLevelUp();
    }
  }

  upgradeWeapon() {
    if (this.weaponTier < 5) {
      this.weaponTier++;
      this.ammo = this.effectiveMag;
      this.reloadTimer = 0;
    } else {
      const others = WEAPON_KEYS.filter(k => k !== this.weaponKey);
      const newW = others[Math.floor(Math.random() * others.length)];
      this.weaponKey = newW;
      this.weaponTier = 3;
      this.ammo = this.effectiveMag;
      this.reloadTimer = 0;
    }
  }

  addSkill(skillId) {
    this.skills.add(skillId);
    if (skillId === 'multishot') this.extraShots = 2;
    if (skillId === 'pierce') this.pierceBonus = 5;
    if (skillId === 'critmaster') { this.critChance += 0.3; this.critMult = 2.5; }
  }

  draw() {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.beginPath();
    ctx.ellipse(0, 7, this.radius * 1.0, this.radius * 0.35, 0, 0, TAU);
    ctx.fill();
    ctx.rotate(this.angle);
    ctx.translate(-this.recoilOffset * 0.3, 0);

    const flicker = this.invuln > 0 && Math.floor(this.invuln / 3) % 2 === 0;
    const vestColor = flicker ? '#ff5252' : '#3a5a7a';
    const accent = flicker ? '#ff8888' : (this.skills.size > 0 ? '#b347d9' : '#6a8aaa');

    // 武器
    if (this.activeWeapon === 'knife') {
      // 小刀
      ctx.fillStyle = '#cccccc';
      ctx.fillRect(this.radius - 2, -2, 18, 4);
      ctx.fillStyle = '#444444';
      ctx.fillRect(this.radius - 2, -3, 6, 6);
      // 刀光
      if (this.knifeSlash > 0) {
        const f = this.knifeSlash / 10;
        ctx.strokeStyle = `rgba(255, 255, 255, ${f * 0.8})`;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(0, 0, this.radius + 30, -Math.PI / 3, Math.PI / 3);
        ctx.stroke();
        ctx.strokeStyle = `rgba(170, 200, 255, ${f * 0.5})`;
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.arc(0, 0, this.radius + 30, -Math.PI / 3, Math.PI / 3);
        ctx.stroke();
      }
    } else {
      ctx.fillStyle = '#1a1d23';
      ctx.fillRect(this.radius - 2, -3, 22, 6);
      ctx.fillStyle = '#0a0c10';
      ctx.fillRect(this.radius + 18, -2.5, 5, 5);
      if (this.muzzleFlash > 0) {
        const f = this.muzzleFlash / 6;
        ctx.fillStyle = `rgba(255, 220, 100, ${f * 0.9})`;
        ctx.beginPath(); ctx.arc(this.radius + 24, 0, 8 * f + 3, 0, TAU); ctx.fill();
        ctx.fillStyle = `rgba(255, 255, 220, ${f * 0.7})`;
        ctx.beginPath(); ctx.arc(this.radius + 24, 0, 4 * f + 1, 0, TAU); ctx.fill();
      }
    }
    ctx.fillStyle = vestColor;
    ctx.beginPath();
    ctx.ellipse(0, 0, this.radius * 0.85, this.radius * 0.95, 0, 0, TAU);
    ctx.fill();
    ctx.fillStyle = '#2a3a4a';
    ctx.fillRect(-this.radius * 0.7, -2, this.radius * 1.4, 4);
    ctx.fillStyle = '#c89060';
    ctx.beginPath();
    ctx.arc(0, 0, this.radius * 0.55, 0, TAU);
    ctx.fill();
    ctx.fillStyle = '#2a3a4a';
    ctx.beginPath();
    ctx.arc(0, 0, this.radius * 0.55, Math.PI, TAU);
    ctx.fill();
    ctx.fillStyle = accent;
    ctx.fillRect(-this.radius * 0.55, -this.radius * 0.55, this.radius * 1.1, 1.5);
    ctx.fillStyle = accent;
    ctx.beginPath();
    ctx.moveTo(this.radius * 0.35, -2);
    ctx.lineTo(this.radius * 0.6, 0);
    ctx.lineTo(this.radius * 0.35, 2);
    ctx.closePath(); ctx.fill();
    ctx.restore();

    if (this.pickupRangeMult > 1.3) {
      const range = 60 * this.pickupRangeMult;
      ctx.strokeStyle = `rgba(106, 138, 170, ${0.06 + 0.04 * Math.sin(game.time * 0.05)})`;
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(this.x, this.y, range, 0, TAU); ctx.stroke();
    }
  }
}

// ===================== 敌人 =====================
class Enemy {
  constructor(x, y, type, waveBonus) {
    this.x = x; this.y = y; this.type = type;
    const t = ENEMY_TYPES[type];
    Object.assign(this, t);
    const buff = BOSS_KEYS.includes(type) ? 1 : (1 + waveBonus * 0.05);
    this.hp = t.hp * buff;
    this.maxHp = this.hp;
    this.damage = t.damage * (1 + waveBonus * 0.03);
    this.angle = 0; this.dead = false; this.hitFlash = 0; this.spawnAnim = 18;
    this.attackCD = 0; this.fireTimer = Math.floor(Math.random() * 60) + 30;
    this.sideStep = Math.random() < 0.5 ? 1 : -1; this.healTimer = 0;
    this.slow = 0; this.poisonStacks = 0; this.poisonTimer = 0;
    this.burstCount = t.burstCount || 0; this.burstShotsLeft = 0; this.burstDelay = 0;
    this.flameParticles = 0; this.dashTimer = 0; this.dashCD = 120; this.enraged = false;
  }
  get isBoss() { return BOSS_KEYS.includes(this.type); }

  update() {
    if (this.spawnAnim > 0) { this.spawnAnim--; return; }
    const p = game.player;
    const dx = p.x - this.x; const dy = p.y - this.y;
    const d = Math.hypot(dx, dy);
    this.angle = Math.atan2(dy, dx);
    const slowMult = this.slow > 0 ? 0.5 : 1;
    if (this.slow > 0) this.slow--;
    if (this.poisonStacks > 0) {
      this.poisonTimer--;
      if (this.poisonTimer <= 0) {
        this.takeDamage(this.poisonStacks * 2, true);
        this.poisonStacks = Math.max(0, this.poisonStacks - 1);
        this.poisonTimer = 30;
      }
    }
    const sp = this.speed * slowMult;
    switch (this.behavior) {
      case 'chase':
        if (d > 0.1) { this.x += (dx / d) * sp; this.y += (dy / d) * sp; }
        if (d < this.radius + p.radius + 2 && this.attackCD <= 0) { p.takeDamage(this.damage, this); this.attackCD = 25; }
        break;
      case 'shooter':
        const desired = this.sniper ? 380 : (this.weapon === 'shotgun' ? 160 : 250);
        if (d < desired - 30) { this.x -= (dx / d) * sp; this.y -= (dy / d) * sp; }
        else if (d > desired + 50) { this.x += (dx / d) * sp; this.y += (dy / d) * sp; }
        else { this.x += -dy / d * sp * 0.5 * this.sideStep; this.y += dx / d * sp * 0.5 * this.sideStep; }
        if (d < this.range) {
          if (this.burstShotsLeft > 0) {
            this.burstDelay--;
            if (this.burstDelay <= 0) { this.shoot(); this.burstShotsLeft--; this.burstDelay = 6; }
            if (this.burstShotsLeft === 0) this.fireTimer = this.fireRate;
          } else {
            this.fireTimer--;
            if (this.fireTimer <= 0) {
              if (this.burstCount > 0) { this.burstShotsLeft = this.burstCount; this.burstDelay = 0; }
              else { this.shoot(); this.fireTimer = this.fireRate; }
            }
          }
        }
        break;
      case 'bomber':
        if (d > 0.1) { this.x += (dx / d) * sp; this.y += (dy / d) * sp; }
        if (d < this.explodeRadius * 0.7) this.explode();
        break;
      case 'medic':
        let target = null, minD = Infinity;
        for (const e of game.enemies) {
          if (e === this || e.dead || e.type === 'medic') continue;
          const ed = dist(this, e);
          if (ed < minD) { minD = ed; target = e; }
        }
        if (target) {
          const tdx = target.x - this.x, tdy = target.y - this.y;
          const td = Math.hypot(tdx, tdy);
          if (td > 40) { this.x += (tdx / td) * sp; this.y += (tdy / td) * sp; }
          this.healTimer--;
          if (this.healTimer <= 0) {
            this.healTimer = this.healRate;
            for (const e of game.enemies) {
              if (e === this || e.dead) continue;
              if (dist(this, e) < this.healRange) {
                e.hp = Math.min(e.maxHp, e.hp + this.healAmount);
                const ang = Math.atan2(e.y - this.y, e.x - this.x);
                game.particles.push(new Particle(this.x + Math.cos(ang) * 8, this.y + Math.sin(ang) * 8, Math.cos(ang) * 2, Math.sin(ang) * 2, 18, '#4ad45a', 2));
              }
            }
          }
        } else { if (d > 0.1) { this.x += (dx / d) * sp; this.y += (dy / d) * sp; } }
        if (d < this.radius + p.radius + 2 && this.attackCD <= 0) { p.takeDamage(this.damage, this); this.attackCD = 25; }
        break;
      case 'flamer':
        const fdesired = 130;
        if (d > fdesired + 20) { this.x += (dx / d) * sp; this.y += (dy / d) * sp; }
        else if (d < fdesired - 30) { this.x -= (dx / d) * sp; this.y -= (dy / d) * sp; }
        else { this.x += -dy / d * sp * 0.4 * this.sideStep; this.y += dx / d * sp * 0.4 * this.sideStep; }
        if (d < this.flameRange) {
          this.flameParticles++;
          if (this.flameParticles >= 2) {
            this.flameParticles = 0;
            for (let i = 0; i < 3; i++) {
              const a = this.angle + rand(-0.25, 0.25); const sp2 = rand(3, 7);
              game.particles.push(new Particle(this.x + Math.cos(this.angle) * (this.radius + 8), this.y + Math.sin(this.angle) * (this.radius + 8), Math.cos(a) * sp2, Math.sin(a) * sp2, 25, i === 0 ? '#ff4400' : (i === 1 ? '#ff8800' : '#ffcc00'), rand(3, 5), 'flame'));
            }
            if (d < this.flameRange) {
              const angDiff = Math.abs(((this.angle - Math.atan2(dy, dx) + Math.PI) % TAU) - Math.PI);
              if (angDiff < 0.4) p.takeDamage(this.flameDamage, this);
            }
          }
        }
        break;
      case 'boss_turret':
        const bDesired = 280;
        if (d < bDesired - 30) { this.x -= (dx / d) * sp; this.y -= (dy / d) * sp; }
        else if (d > bDesired + 40) { this.x += (dx / d) * sp; this.y += (dy / d) * sp; }
        else { this.x += -dy / d * sp * 0.3 * this.sideStep; this.y += dx / d * sp * 0.3 * this.sideStep; }
        this.fireTimer--;
        if (this.fireTimer <= 0) {
          this.fireTimer = 150;
          for (let i = 0; i < 24; i++) {
            const a = (i / 24) * TAU + game.time * 0.01;
            game.bullets.push(new Bullet(this.x, this.y, a, { color: '#ff5252', glow: '#ff5252', damage: 12, bulletSpeed: 7, size: 4, life: 120 }, 'enemy'));
          }
        }
        this.attackCD--;
        if (this.attackCD <= 0) {
          this.attackCD = 40;
          for (let i = -2; i <= 2; i++) {
            const a = this.angle + i * 0.15;
            game.bullets.push(new Bullet(this.x, this.y, a, { color: '#ffaa44', glow: '#ffaa44', damage: 10, bulletSpeed: 12, size: 3, life: 80 }, 'enemy'));
          }
        }
        break;
      case 'boss_summoner':
        const sDesired = 350;
        if (d < sDesired - 30) { this.x -= (dx / d) * sp; this.y -= (dy / d) * sp; }
        else if (d > sDesired + 40) { this.x += (dx / d) * sp; this.y += (dy / d) * sp; }
        this.fireTimer--;
        if (this.fireTimer <= 0) {
          this.fireTimer = 200;
          for (let i = 0; i < 3; i++) {
            const a = rand(0, TAU); const r = 60;
            const ex = clamp(this.x + Math.cos(a) * r, 20, canvas.width - 20);
            const ey = clamp(this.y + Math.sin(a) * r, 20, canvas.height - 20);
            const e = new Enemy(ex, ey, 'runner', game.wave);
            e.spawnAnim = 20; game.enemies.push(e);
          }
          for (let i = 0; i < 20; i++) {
            const a = rand(0, TAU);
            game.particles.push(new Particle(this.x, this.y, Math.cos(a) * rand(2, 5), Math.sin(a) * rand(2, 5), 30, '#b347d9', rand(2, 4)));
          }
        }
        this.attackCD--;
        if (this.attackCD <= 0) {
          this.attackCD = 90;
          for (let i = 0; i < 16; i++) {
            const a = (i / 16) * TAU;
            game.bullets.push(new Bullet(this.x, this.y, a, { color: '#b347d9', glow: '#b347d9', damage: 8, bulletSpeed: 6, size: 3, life: 90 }, 'enemy'));
          }
        }
        break;
      case 'boss_stalker':
        this.dashCD--;
        if (this.dashCD <= 0 && this.dashTimer === 0) { this.dashTimer = 40; this.dashCD = 180; }
        let stalkerSpeed = this.speed;
        if (this.dashTimer > 20) {
          stalkerSpeed *= 0.3;
          if (game.time % 3 === 0) game.particles.push(new Particle(this.x, this.y, rand(-1, 1), rand(-1, 1), 15, this.accent, 3));
        } else if (this.dashTimer > 0) {
          stalkerSpeed = 12;
          game.particles.push(new Particle(this.x, this.y, 0, 0, 10, this.color, this.radius * 0.9, 'smoke'));
        }
        this.dashTimer--;
        if (d > 0.1) { this.x += (dx / d) * stalkerSpeed; this.y += (dy / d) * stalkerSpeed; }
        if (d < this.radius + p.radius + 2 && this.attackCD <= 0) { p.takeDamage(this.damage, this); this.attackCD = 30; }
        break;
      case 'boss_artillery':
        if (d < 120) {
          this.x -= (dx / d) * sp; this.y -= (dy / d) * sp;
          this.attackCD--;
          if (this.attackCD <= 0 && d < 120) {
            this.attackCD = 60;
            game.shockwaves.push({ x: this.x, y: this.y, r: 5, maxR: 150, life: 25, damaging: true, damage: 40, hit: new Set() });
            game.shake = Math.min(game.shake + 8, 15);
            for (let i = 0; i < 20; i++) {
              const a = rand(0, TAU);
              game.particles.push(new Particle(this.x, this.y, Math.cos(a) * rand(2, 5), Math.sin(a) * rand(2, 5), 30, this.accent, rand(3, 5)));
            }
          }
        } else {
          const artDesired = 300;
          if (d < artDesired - 30) { this.x -= (dx / d) * sp; this.y -= (dy / d) * sp; }
          else if (d > artDesired + 40) { this.x += (dx / d) * sp; this.y += (dy / d) * sp; }
          this.fireTimer--;
          if (this.fireTimer <= 0) {
            this.fireTimer = 120;
            for (let i = 0; i < 4; i++) {
              const a = this.angle + (i - 1.5) * 0.4;
              const b = new Bullet(this.x, this.y, a, { color: '#ff8800', glow: '#ffaa00', damage: 18, bulletSpeed: 6, size: 5, life: 200, homing: true }, 'enemy');
              game.bullets.push(b);
            }
            for (let i = 0; i < 6; i++) {
              const a = rand(0, TAU);
              game.particles.push(new Particle(this.x, this.y, Math.cos(a) * rand(1, 3), Math.sin(a) * rand(1, 3), 10, this.accent, rand(1, 2)));
            }
          }
        }
        break;
      case 'boss_berserker':
        if (!this.enraged && this.hp < this.maxHp * 0.5) {
          this.enraged = true; this.speed = 4.5; this.damage = 50;
          this.color = '#c41e3a'; this.accent = '#ff5252'; this.radius = 40;
          for (let i = 0; i < 40; i++) {
            const a = rand(0, TAU);
            game.particles.push(new Particle(this.x, this.y, Math.cos(a) * rand(2, 7), Math.sin(a) * rand(2, 7), 45, '#ff5252', rand(3, 5)));
          }
          game.shake = Math.min(game.shake + 10, 15);
        }
        if (d > 0.1) { this.x += (dx / d) * sp; this.y += (dy / d) * sp; }
        if (d < this.radius + p.radius + 2 && this.attackCD <= 0) { p.takeDamage(this.damage, this); this.attackCD = 25; }
        break;
    }
    if (this.attackCD > 0) this.attackCD--;
    if (this.hitFlash > 0) this.hitFlash--;
  }

  shoot() {
    const ang = this.angle + rand(-0.05, 0.05);
    const bx = this.x + Math.cos(this.angle) * (this.radius + 12);
    const by = this.y + Math.sin(this.angle) * (this.radius + 12);
    if (this.pellets) {
      for (let i = 0; i < this.pellets; i++) {
        const s = (Math.random() - 0.5) * this.spread * 2;
        game.bullets.push(new Bullet(bx, by, ang + s, { color: this.accent, glow: this.accent, damage: this.bulletDamage, bulletSpeed: this.bulletSpeed, size: 3, life: 35 }, 'enemy'));
      }
    } else {
      game.bullets.push(new Bullet(bx, by, ang, { color: this.accent, glow: this.accent, damage: this.bulletDamage, bulletSpeed: this.bulletSpeed, size: this.sniper ? 4.5 : 3.2, life: this.sniper ? 120 : 80 }, 'enemy'));
    }
    for (let i = 0; i < 3; i++) {
      const a = this.angle + rand(-0.3, 0.3);
      game.particles.push(new Particle(bx, by, Math.cos(a) * rand(1, 3), Math.sin(a) * rand(1, 3), 7, this.accent, rand(1, 1.8)));
    }
  }

  explode() {
    this.dead = true;
    const p = game.player; const d = dist(this, p);
    if (d < this.explodeRadius) p.takeDamage(this.damage * (1 - d / this.explodeRadius), this);
    for (let i = 0; i < 40; i++) {
      const a = rand(0, TAU); const sp = rand(2, 8);
      game.particles.push(new Particle(this.x, this.y, Math.cos(a) * sp, Math.sin(a) * sp, 45, i % 2 ? '#ff7a18' : '#ffcc44', rand(2, 5)));
    }
    for (let i = 0; i < 12; i++) {
      const a = rand(0, TAU);
      game.particles.push(new Particle(this.x, this.y, Math.cos(a) * rand(0.5, 2), Math.sin(a) * rand(0.5, 2) - 1, 55, '#444450', rand(3, 5), 'smoke'));
    }
    game.shake = Math.min(game.shake + 6, 12);
    game.shockwaves.push({ x: this.x, y: this.y, r: 5, maxR: this.explodeRadius, life: 18 });
  }

  takeDamage(amount, fromDot) {
    if (this.dead) return;
    if (this.shield && !fromDot) {
      const p = game.player;
      const angToP = Math.atan2(p.y - this.y, p.x - this.x);
      const diff = Math.abs(((this.angle - angToP + Math.PI) % TAU) - Math.PI);
      if (diff < 0.9) {
        amount *= (1 - this.shield);
        const shieldX = this.x + Math.cos(this.angle) * (this.radius + 4);
        const shieldY = this.y + Math.sin(this.angle) * (this.radius + 4);
        for (let i = 0; i < 3; i++) {
          const a = rand(0, TAU);
          game.particles.push(new Particle(shieldX, shieldY, Math.cos(a) * 2, Math.sin(a) * 2, 9, '#4a90e2', rand(1, 2)));
        }
      }
    }
    this.hp -= amount;
    this.hitFlash = 4;
    floaters.push({ x: this.x + rand(-8, 8), y: this.y - this.radius - 4, text: Math.ceil(amount), life: 32, maxLife: 32, vy: -1.4, color: amount > 50 ? '#ff5252' : '#ffcc44', size: amount > 50 ? 15 : 12 });
    for (let i = 0; i < 4; i++) {
      const a = rand(0, TAU); const sp = rand(1, 3);
      game.particles.push(new Particle(this.x, this.y, Math.cos(a) * sp, Math.sin(a) * sp, 18, '#aa3030', rand(1.5, 2.5)));
    }
    if (this.hp <= 0) this.die();
  }

  die() {
    if (this.dead) return;
    this.dead = true; game.score += this.score; game.player.kills++;
    if (game.player.lifesteal > 0) game.player.heal(game.player.lifesteal);
    for (let i = 0; i < 22; i++) {
      const a = rand(0, TAU); const sp = rand(1.5, 6);
      game.particles.push(new Particle(this.x, this.y, Math.cos(a) * sp, Math.sin(a) * sp, 35, '#aa3030', rand(1.8, 3.5)));
    }
    for (let i = 0; i < 7; i++) {
      const a = rand(0, TAU);
      game.particles.push(new Particle(this.x, this.y, Math.cos(a) * rand(0.3, 1.5), Math.sin(a) * rand(0.3, 1.5) - 0.8, 45, '#555560', rand(2, 3.5), 'smoke'));
    }
    if (game.player.hasShock) game.shockwaves.push({ x: this.x, y: this.y, r: 5, maxR: 85, life: 16, damaging: true, damage: 35, hit: new Set() });
    const xpOrbCount = this.isBoss ? 15 : Math.min(5, Math.ceil(this.xp / 8));
    const xpPerOrb = this.xp / xpOrbCount;
    for (let i = 0; i < xpOrbCount; i++) {
      const a = rand(0, TAU); const sp = rand(1, this.isBoss ? 5 : 3);
      game.orbs.push(new ExpOrb(this.x + rand(-5, 5), this.y + rand(-5, 5), Math.cos(a) * sp, Math.sin(a) * sp, xpPerOrb));
    }
    game.shake = Math.min(game.shake + 1.5, 8);
    addKillFeed(this.name, this.score);
    if (this.isBoss) {
      game.crates.push(new Crate(this.x - 40, this.y, 'weapon'));
      game.crates.push(new Crate(this.x + 40, this.y, 'skill'));
      game.crates.push(new Crate(this.x, this.y - 40, 'weapon'));
      game.crates.push(new Crate(this.x, this.y + 40, 'skill'));
      game.drops.push(new Drop(this.x - 20, this.y, 'health', null));
      game.drops.push(new Drop(this.x + 20, this.y, 'ammo', null));
      showFloater(this.x, this.y, 'BOSS 击破！', '#ffb800');
    } else {
      const r = Math.random(); const luck = game.player.dropLuck;
      if (r < 0.05 * luck) {
        const keys = WEAPON_KEYS.filter(k => k !== game.player.weaponKey);
        const w = keys[Math.floor(Math.random() * keys.length)];
        game.drops.push(new Drop(this.x, this.y, 'weapon', w));
      } else if (r < 0.18 * luck) game.drops.push(new Drop(this.x, this.y, 'ammo', null));
      else if (r < 0.26 * luck) game.drops.push(new Drop(this.x, this.y, 'health', null));
    }
  }

  draw() {
    if (this.spawnAnim > 0) {
      const t = 1 - this.spawnAnim / 18;
      ctx.save(); ctx.translate(this.x, this.y); ctx.globalAlpha = t;
      ctx.strokeStyle = this.accent; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0, 0, this.radius * (2 - t), 0, TAU); ctx.stroke();
      ctx.restore(); return;
    }
    ctx.save(); ctx.translate(this.x, this.y);
    ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
    ctx.beginPath(); ctx.ellipse(0, 6, this.radius * 0.95, this.radius * 0.32, 0, 0, TAU); ctx.fill();
    if (this.slow > 0) { ctx.strokeStyle = 'rgba(74, 212, 240, 0.35)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, 0, this.radius + 3, 0, TAU); ctx.stroke(); }
    if (this.poisonStacks > 0) { ctx.strokeStyle = 'rgba(74, 220, 90, 0.35)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(0, 0, this.radius + 5, 0, TAU); ctx.stroke(); }
    ctx.rotate(this.angle);
    const flashing = this.hitFlash > 0;
    const vestColor = flashing ? '#ffffff' : this.color;
    const skinColor = flashing ? '#ffffff' : this.skin;
    if (this.sniper && this.fireTimer < 30 && this.fireTimer > 0) {
      const a = Math.sin(this.fireTimer * 0.5) * 0.5 + 0.5;
      ctx.strokeStyle = `rgba(255, 60, 60, ${a * 0.5})`; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(this.radius, 0); ctx.lineTo(this.range, 0); ctx.stroke();
    }
    let gunLen = 18;
    if (this.weapon === 'rifle' || this.weapon === 'smg' || this.weapon === 'lmg') gunLen = 26;
    if (this.weapon === 'sniper') gunLen = 30;
    if (this.weapon === 'shotgun') gunLen = 22;
    if (this.weapon === 'knife') gunLen = 10;
    if (this.weapon === 'flamer') gunLen = 24;
    if (this.weapon !== 'none') {
      ctx.fillStyle = '#1a1a1a'; ctx.fillRect(this.radius - 2, -2.5, gunLen, 5);
      ctx.fillStyle = '#0a0a0a'; ctx.fillRect(this.radius + gunLen - 4, -2, 4, 4);
    }
    if (this.shape === 'human_bomb') {
      ctx.fillStyle = '#1a1a1a'; ctx.fillRect(-this.radius * 0.5, -this.radius * 0.5, this.radius, this.radius);
      const pulse = 0.5 + 0.5 * Math.sin(game.time * 0.4);
      ctx.fillStyle = `rgba(255, 200, 60, ${pulse})`; ctx.beginPath(); ctx.arc(0, 0, 3, 0, TAU); ctx.fill();
    }
    if (this.shape === 'human_heavy') {
      ctx.fillStyle = vestColor; ctx.fillRect(-this.radius * 0.9, -this.radius * 0.85, this.radius * 1.8, this.radius * 1.7);
      ctx.fillStyle = '#1a1a2a'; ctx.fillRect(-this.radius * 0.9, -this.radius * 0.3, this.radius * 1.8, this.radius * 0.25);
      ctx.fillRect(-this.radius * 0.9, this.radius * 0.15, this.radius * 1.8, this.radius * 0.25);
      ctx.fillStyle = this.accent; ctx.beginPath(); ctx.arc(0, 0, this.radius * 0.25, 0, TAU); ctx.fill();
    } else {
      ctx.fillStyle = vestColor; ctx.beginPath(); ctx.ellipse(0, 0, this.radius * 0.78, this.radius * 0.88, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fillRect(-this.radius * 0.6, -2, this.radius * 1.2, 3);
    }
    if (this.shape === 'human_shield') {
      ctx.fillStyle = '#1a3a6a'; ctx.fillRect(this.radius - 2, -this.radius - 1, 5, this.radius * 2 + 2);
      ctx.strokeStyle = this.accent; ctx.lineWidth = 1; ctx.strokeRect(this.radius - 2, -this.radius - 1, 5, this.radius * 2 + 2);
    }
    if (this.shape === 'human_medic') {
      ctx.fillStyle = '#ffffff'; ctx.fillRect(-3, -this.radius * 0.4, 6, this.radius * 0.8); ctx.fillRect(-this.radius * 0.4, -3, this.radius * 0.8, 6);
    }
    ctx.fillStyle = skinColor; ctx.beginPath(); ctx.arc(0, 0, this.radius * 0.5, 0, TAU); ctx.fill();
    ctx.fillStyle = vestColor; ctx.beginPath(); ctx.arc(0, 0, this.radius * 0.5, Math.PI, TAU); ctx.fill();
    ctx.fillStyle = this.accent; ctx.fillRect(-this.radius * 0.5, -this.radius * 0.5, this.radius, 1.2);
    ctx.restore();
    if (this.hp < this.maxHp && this.spawnAnim === 0 && !this.isBoss) {
      const bw = this.radius * 2.2; const bx = this.x - bw / 2; const by = this.y - this.radius - 8;
      ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(bx - 1, by - 1, bw + 2, 3);
      ctx.fillStyle = this.color; ctx.fillRect(bx, by, bw * (this.hp / this.maxHp), 1.5);
    }
  }
}

// ===================== 子弹 =====================
class Bullet {
  constructor(x, y, angle, opts, owner) {
    this.x = x; this.y = y;
    this.vx = Math.cos(angle) * opts.bulletSpeed; this.vy = Math.sin(angle) * opts.bulletSpeed;
    this.angle = angle; this.baseSpeed = opts.bulletSpeed;
    this.damage = opts.damage; this.color = opts.color; this.glow = opts.glow || opts.color;
    this.size = opts.size || 3; this.life = opts.life || 60; this.owner = owner;
    this.pierce = opts.pierce || 0; this.bounce = opts.bounce || 0;
    this.homing = opts.homing || false; this.boomerang = opts.boomerang || false;
    this.split = opts.split || false; this.shock = opts.shock || false;
    this.chain = opts.chain || false; this.poison = opts.poison || false; this.freeze = opts.freeze || false;
    this.hitEnemies = new Set(); this.dead = false; this.trail = []; this.crit = false;
    this.maxDist = 500; this.distTraveled = 0; this.returning = false;
  }
  update() {
    this.trail.push({ x: this.x, y: this.y }); if (this.trail.length > 6) this.trail.shift();
    if (this.homing) {
      let target = null;
      if (this.owner === 'player') {
        let nd = Infinity;
        for (const e of game.enemies) { if (e.dead || e.spawnAnim > 0) continue; const d = dist(this, e); if (d < nd && d < 180) { nd = d; target = e; } }
      } else if (this.owner === 'enemy') target = game.player;
      if (target) {
        const targetAngle = Math.atan2(target.y - this.y, target.x - this.x);
        const cur = Math.atan2(this.vy, this.vx);
        let diff = targetAngle - cur;
        while (diff > Math.PI) diff -= TAU; while (diff < -Math.PI) diff += TAU;
        const newAngle = cur + clamp(diff, -0.15, 0.15);
        this.vx = Math.cos(newAngle) * this.baseSpeed; this.vy = Math.sin(newAngle) * this.baseSpeed;
      }
    }
    if (this.boomerang && this.owner === 'player') {
      if (!this.returning) { this.distTraveled += this.baseSpeed; if (this.distTraveled > this.maxDist) this.returning = true; }
      else {
        const targetAngle = Math.atan2(game.player.y - this.y, game.player.x - this.x);
        const cur = Math.atan2(this.vy, this.vx);
        let diff = targetAngle - cur;
        while (diff > Math.PI) diff -= TAU; while (diff < -Math.PI) diff += TAU;
        const newAngle = cur + clamp(diff, -0.2, 0.2);
        this.vx = Math.cos(newAngle) * this.baseSpeed; this.vy = Math.sin(newAngle) * this.baseSpeed;
        if (dist(this, game.player) < 20) this.dead = true;
      }
    }
    this.x += this.vx; this.y += this.vy; this.life--;
    if (this.bounce > 0) {
      if (this.x < 0 || this.x > canvas.width) { this.vx = -this.vx; this.bounce--; }
      if (this.y < 0 || this.y > canvas.height) { this.vy = -this.vy; this.bounce--; }
    }
    if (this.life <= 0 || this.x < -80 || this.x > canvas.width + 80 || this.y < -80 || this.y > canvas.height + 80) { this.dead = true; return; }
    if (this.owner === 'player') {
      for (const e of game.enemies) {
        if (e.dead || e.spawnAnim > 0) continue;
        if (this.hitEnemies.has(e)) continue;
        if (dist(this, e) < e.radius + this.size) {
          this.onHitEnemy(e);
          if (this.pierce <= 0) { this.dead = true; break; } else this.pierce--;
        }
      }
    } else if (this.owner === 'enemy') {
      const p = game.player;
      if (dist(this, p) < p.radius + this.size) {
        p.takeDamage(this.damage); this.dead = true;
        for (let i = 0; i < 5; i++) { const a = rand(0, TAU); const sp = rand(1, 2.5); game.particles.push(new Particle(this.x, this.y, Math.cos(a) * sp, Math.sin(a) * sp, 12, this.glow, rand(1, 2))); }
      }
    }
  }
  onHitEnemy(e) {
    e.takeDamage(this.damage); this.hitEnemies.add(e);
    if (this.poison) { e.poisonStacks = Math.min(5, e.poisonStacks + 1); e.poisonTimer = 30; }
    if (this.freeze) e.slow = 90;
    if (this.split && !this.splitTriggered) {
      this.splitTriggered = true;
      for (let i = 0; i < 2; i++) {
        const a = this.angle + (i === 0 ? Math.PI / 3 : -Math.PI / 3);
        const b = new Bullet(this.x, this.y, a, { damage: this.damage * 0.5, color: this.color, glow: this.glow, bulletSpeed: this.baseSpeed, size: this.size * 0.8, life: 35 }, 'player');
        game.bullets.push(b);
      }
    }
    if (this.chain && !this.chainTriggered) {
      this.chainTriggered = true;
      let nearest = null, nd = Infinity;
      for (const e2 of game.enemies) { if (e2 === e || e2.dead || e2.spawnAnim > 0) continue; const d = dist(this, e2); if (d < nd && d < 140) { nd = d; nearest = e2; } }
      if (nearest) { nearest.takeDamage(this.damage * 0.6); game.lightnings.push({ x1: this.x, y1: this.y, x2: nearest.x, y2: nearest.y, life: 7 }); }
    }
    for (let i = 0; i < 4; i++) { const a = rand(0, TAU); const sp = rand(1, 2.5); game.particles.push(new Particle(this.x, this.y, Math.cos(a) * sp, Math.sin(a) * sp, 12, this.glow, rand(1, 2.2))); }
  }
  draw() {
    for (let i = 0; i < this.trail.length; i++) { const t = this.trail[i]; const a = i / this.trail.length; ctx.globalAlpha = a * 0.35; ctx.fillStyle = this.color; ctx.beginPath(); ctx.arc(t.x, t.y, Math.max(0.5, this.size * a * 0.7), 0, TAU); ctx.fill(); }
    ctx.globalAlpha = 1; ctx.fillStyle = this.color; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, TAU); ctx.fill();
    if (this.crit) { ctx.strokeStyle = '#ff5252'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(this.x, this.y, this.size + 2, 0, TAU); ctx.stroke(); }
  }
}

// ===================== 粒子 =====================
class Particle {
  constructor(x, y, vx, vy, life, color, size, type) {
    this.x = x; this.y = y; this.vx = vx; this.vy = vy; this.life = life; this.maxLife = life;
    this.color = color; this.size = size; this.type = type || 'normal'; this.dead = false;
    this.rotation = rand(0, TAU); this.rotSpeed = rand(-0.2, 0.2);
  }
  update() {
    this.x += this.vx; this.y += this.vy;
    if (this.type === 'shell') { this.vy += 0.18; this.vx *= 0.98; this.rotation += this.rotSpeed; }
    else if (this.type === 'smoke') { this.vx *= 0.95; this.vy *= 0.95; this.vy -= 0.05; }
    else if (this.type === 'flame') { this.vx *= 0.9; this.vy *= 0.9; this.vy -= 0.1; }
    else { this.vx *= 0.92; this.vy *= 0.92; }
    this.life--; if (this.life <= 0) this.dead = true;
  }
  draw() {
    const a = this.life / this.maxLife;
    if (this.type === 'shell') { ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.rotation); ctx.globalAlpha = a; ctx.fillStyle = this.color; ctx.fillRect(-2.2, -0.8, 4.4, 1.6); ctx.restore(); ctx.globalAlpha = 1; }
    else if (this.type === 'smoke') { ctx.globalAlpha = a * 0.35; ctx.fillStyle = this.color; ctx.beginPath(); ctx.arc(this.x, this.y, this.size * (2 - a), 0, TAU); ctx.fill(); ctx.globalAlpha = 1; }
    else if (this.type === 'flame') { ctx.globalAlpha = a * 0.8; ctx.fillStyle = this.color; ctx.beginPath(); ctx.arc(this.x, this.y, this.size * (1.5 - a * 0.5), 0, TAU); ctx.fill(); ctx.globalAlpha = 1; }
    else { ctx.globalAlpha = a; ctx.fillStyle = this.color; ctx.beginPath(); ctx.arc(this.x, this.y, Math.max(0.5, this.size * a), 0, TAU); ctx.fill(); ctx.globalAlpha = 1; }
  }
}

// ===================== 经验球（加速拾取）=====================
class ExpOrb {
  constructor(x, y, vx, vy, xp) {
    this.x = x; this.y = y; this.vx = vx; this.vy = vy;
    this.xp = xp; this.life = 600; this.dead = false;
    this.radius = 5; this.bob = rand(0, TAU);
  }
  update() {
    this.bob += 0.1; this.life--;
    if (this.life <= 0) { this.dead = true; return; }
    const p = game.player;
    const d = dist(this, p);
    const magnet = 90 * p.pickupRangeMult; // 从 70 提升到 90
    if (d < magnet) {
      const ang = Math.atan2(p.y - this.y, p.x - this.x);
      const force = (1 - d / magnet) * 1.8; // 从 0.9 提升到 1.8
      this.vx += Math.cos(ang) * force;
      this.vy += Math.sin(ang) * force;
    }
    this.vx *= 0.85; // 从 0.92 降到 0.85，让加速效果更明显
    this.vy *= 0.85;
    this.x += this.vx; this.y += this.vy;
    if (d < p.radius + this.radius + 4) { // 增加拾取判定范围
      p.addXP(this.xp); this.dead = true;
      for (let i = 0; i < 3; i++) { const a = rand(0, TAU); game.particles.push(new Particle(this.x, this.y, Math.cos(a) * 1.5, Math.sin(a) * 1.5, 14, '#ffb800', rand(1.5, 2.2))); }
    }
  }
  draw() {
    const bob = Math.sin(this.bob) * 2;
    if (this.life < 60 && Math.floor(this.life / 6) % 2 === 0) return;
    const r = this.radius + bob * 0.2;
    ctx.fillStyle = 'rgba(255, 184, 0, 0.18)'; ctx.beginPath(); ctx.arc(this.x, this.y + bob, r * 2, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ffb800'; ctx.beginPath(); ctx.arc(this.x, this.y + bob, r, 0, TAU); ctx.fill();
    ctx.fillStyle = '#fff8cc'; ctx.beginPath(); ctx.arc(this.x - 1, this.y + bob - 1, r * 0.4, 0, TAU); ctx.fill();
  }
}

// ===================== 地面物品与箱子 =====================
class Drop {
  constructor(x, y, kind, data) { this.x = x; this.y = y; this.kind = kind; this.data = data; this.life = 600; this.bob = rand(0, TAU); this.dead = false; this.radius = 14; this.spawnAnim = 12; }
  get color() { return this.kind === 'weapon' ? '#ff44aa' : (this.kind === 'ammo' ? '#d4a017' : '#4ad45a'); }
  update() { if (this.spawnAnim > 0) this.spawnAnim--; this.bob += 0.06; this.life--; if (this.life <= 0) { this.dead = true; return; } const p = game.player; if (dist(this, p) < this.radius + p.radius + 4) this.pickup(); }
  pickup() {
    this.dead = true;
    if (this.kind === 'weapon') { game.player.weaponKey = this.data; game.player.ammo = game.player.effectiveMag; game.player.reloadTimer = 0; game.player.fireTimer = 0; for (let i = 0; i < 18; i++) { const a = rand(0, TAU); const sp = rand(2, 5); game.particles.push(new Particle(this.x, this.y, Math.cos(a) * sp, Math.sin(a) * sp, 25, this.color, rand(1.8, 3))); } showFloater(this.x, this.y, WEAPONS[this.data].name, this.color); }
    else if (this.kind === 'ammo') { game.player.ammo = game.player.effectiveMag; game.player.reloadTimer = 0; for (let i = 0; i < 12; i++) { const a = rand(0, TAU); const sp = rand(1.5, 3); game.particles.push(new Particle(this.x, this.y, Math.cos(a) * sp, Math.sin(a) * sp, 20, this.color, rand(1.5, 2.2))); } showFloater(this.x, this.y, '弹药', this.color); }
    else if (this.kind === 'health') { game.player.heal(35); showFloater(this.x, this.y, '+35 HP', this.color); }
  }
  draw() {
    const bob = Math.sin(this.bob) * 3;
    if (this.life < 120 && Math.floor(this.life / 8) % 2 === 0) return;
    const scale = this.spawnAnim > 0 ? (1 - this.spawnAnim / 12) : 1;
    ctx.save(); ctx.translate(this.x, this.y + bob); ctx.scale(scale, scale);
    ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.beginPath(); ctx.ellipse(0, 8 - bob, this.radius * 0.8, this.radius * 0.3, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#1a1d23'; ctx.fillRect(-this.radius, -this.radius, this.radius * 2, this.radius * 2);
    ctx.strokeStyle = this.color; ctx.lineWidth = 2; ctx.strokeRect(-this.radius, -this.radius, this.radius * 2, this.radius * 2);
    ctx.fillStyle = this.color; ctx.fillRect(-this.radius, -this.radius, 4, 4); ctx.fillRect(this.radius - 4, -this.radius, 4, 4);
    ctx.font = 'bold 13px Noto Sans SC'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    let icon = '?';
    if (this.kind === 'weapon') icon = 'W'; else if (this.kind === 'ammo') icon = 'A'; else if (this.kind === 'health') icon = '+';
    ctx.fillText(icon, 0, 1); ctx.restore();
  }
}

class Crate {
  constructor(x, y, type) { this.x = x; this.y = y; this.type = type; this.life = 1800; this.radius = 20; this.bob = rand(0, TAU); this.dead = false; }
  get color() { return this.type === 'weapon' ? '#d4a017' : '#b347d9'; }
  update() { this.bob += 0.04; this.life--; if (this.life <= 0) { this.dead = true; return; } const p = game.player; if (dist(this, p) < this.radius + p.radius) this.open(); }
  open() {
    this.dead = true;
    const flash = document.getElementById('pickup-flash'); flash.classList.remove('show'); void flash.offsetWidth; flash.classList.add('show'); setTimeout(() => flash.classList.remove('show'), 500);
    if (this.type === 'weapon') { game.player.upgradeWeapon(); showFloater(this.x, this.y - 20, '武器升级', '#d4a017'); showFloater(this.x, this.y, WEAPONS[game.player.weaponKey].name + ' T' + game.player.weaponTier, '#ffd84a'); }
    else {
      const owned = Array.from(game.player.skills); const available = SKILLS.filter(s => !owned.includes(s.id)); let skill;
      if (available.length === 0) { skill = SKILLS[Math.floor(Math.random() * SKILLS.length)]; showFloater(this.x, this.y - 20, '技能强化', '#b347d9'); }
      else { skill = available[Math.floor(Math.random() * available.length)]; game.player.addSkill(skill.id); showFloater(this.x, this.y - 20, '获得技能', '#b347d9'); }
      showFloater(this.x, this.y, skill.name, skill.color); updateSkillsHUD();
    }
    for (let i = 0; i < 26; i++) { const a = rand(0, TAU); const sp = rand(2, 6); game.particles.push(new Particle(this.x, this.y, Math.cos(a) * sp, Math.sin(a) * sp, 35, this.color, rand(1.8, 3.5))); }
    game.shockwaves.push({ x: this.x, y: this.y, r: 5, maxR: 70, life: 14 }); game.shake = Math.min(game.shake + 3, 8);
  }
  draw() {
    const bob = Math.sin(this.bob) * 3;
    if (this.life < 300 && Math.floor(this.life / 10) % 2 === 0) return;
    ctx.save(); ctx.translate(this.x, this.y + bob);
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.beginPath(); ctx.ellipse(0, 12 - bob, this.radius * 1.1, this.radius * 0.4, 0, 0, TAU); ctx.fill();
    const gradV = ctx.createLinearGradient(0, -100, 0, 0); gradV.addColorStop(0, 'rgba(0,0,0,0)'); gradV.addColorStop(1, this.color + '44'); ctx.fillStyle = gradV; ctx.fillRect(-this.radius * 0.5, -100, this.radius, 100);

// ===================== 触屏控制（固定摇杆）=====================
const touchState = { move: { active: false, id: null, dx: 0, dy: 0 }, aim: { active: false, id: null, dx: 0, dy: 0 } };
const MOVE_BASE_X = 90, MOVE_BASE_Y = 90; // 左下中心
const AIM_BASE_X = 90, AIM_BASE_Y = 90; // 右下中心（从右算）

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  for (const touch of e.changedTouches) {
    const x = touch.clientX; const y = touch.clientY;
    const halfW = window.innerWidth / 2;
    if (x < halfW && !touchState.move.active) {
      touchState.move.active = true; touchState.move.id = touch.identifier;
      touchState.move.dx = 0; touchState.move.dy = 0;
      showJoystick('move');
    } else if (x >= halfW && !touchState.aim.active) {
      touchState.aim.active = true; touchState.aim.id = touch.identifier;
      touchState.aim.dx = 0; touchState.aim.dy = 0;
      game.mouse.down = true;
      showJoystick('aim');
    }
  }
}, { passive: false });

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  for (const touch of e.changedTouches) {
    if (touch.identifier === touchState.move.id) {
      const halfW = window.innerWidth / 2;
      const baseX = 30 + 60; // 摇杆中心
      const baseY = window.innerHeight - 30 - 60;
      touchState.move.dx = touch.clientX - baseX;
      touchState.move.dy = touch.clientY - baseY;
      updateJoystick('move', touchState.move.dx, touchState.move.dy);
    } else if (touch.identifier === touchState.aim.id) {
      const baseX = window.innerWidth - 30 - 60;
      const baseY = window.innerHeight - 30 - 60;
      touchState.aim.dx = touch.clientX - baseX;
      touchState.aim.dy = touch.clientY - baseY;
      updateJoystick('aim', touchState.aim.dx, touchState.aim.dy);
    }
  }
}, { passive: false });

function endTouch(e) {
  for (const touch of e.changedTouches) {
    if (touch.identifier === touchState.move.id) { touchState.move.active = false; touchState.move.id = null; touchState.move.dx = 0; touchState.move.dy = 0; hideJoystick('move'); }
    else if (touch.identifier === touchState.aim.id) { touchState.aim.active = false; touchState.aim.id = null; game.mouse.down = false; hideJoystick('aim'); }
  }
}
canvas.addEventListener('touchend', e => { e.preventDefault(); endTouch(e); }, { passive: false });
canvas.addEventListener('touchcancel', e => { e.preventDefault(); endTouch(e); }, { passive: false });

function showJoystick(side) {
  const base = document.getElementById(side + '-base');
  const stick = document.getElementById(side + '-stick');
  if (base) base.style.display = 'block';
  if (stick) stick.style.display = 'block';
}
function updateJoystick(side, dx, dy) {
  const stick = document.getElementById(side + '-stick');
  if (!stick) return;
  const len = Math.hypot(dx, dy); const max = 40;
  if (len > max) { dx = dx / len * max; dy = dy / len * max; }
  if (side === 'move') {
    stick.style.left = (30 + 60 + dx - 25) + 'px';
    stick.style.bottom = (30 + 60 - dy - 25) + 'px';
  } else {
    stick.style.right = (30 + 60 - dx - 25) + 'px';
    stick.style.bottom = (30 + 60 - dy - 25) + 'px';
  }
}
function hideJoystick(side) {
  const base = document.getElementById(side + '-base');
  const stick = document.getElementById(side + '-stick');

function spawnCrate() {

  hint.appendChild(item); setTimeout(() => item.classList.add('fade'), 3500); setTimeout(() => item.remove(), 4000);
}

function spawnEnemy() {
  const margin = 50; const side = Math.floor(Math.random() * 4); let x, y;
  if (side === 0) { x = Math.random() * canvas.width; y = -margin; }

function triggerLevelUp() {

// ===================== 主循环 =====================
function update() {
  game.time++;
  if (game.state !== 'playing') return;
  game.player.update();
  for (let i = game.enemies.length - 1; i >= 0; i--) { game.enemies[i].update(); if (game.enemies[i].dead) game.enemies.splice(i, 1); }
  for (let i = game.bullets.length - 1; i >= 0; i--) { game.bullets[i].update(); if (game.bullets[i].dead) game.bullets.splice(i, 1); }
  for (let i = game.particles.length - 1; i >= 0; i--) { game.particles[i].update(); if (game.particles[i].dead) game.particles.splice(i, 1); }
  if (game.particles.length > 700) game.particles.splice(0, game.particles.length - 700);
  for (let i = game.drops.length - 1; i >= 0; i--) { game.drops[i].update(); if (game.drops[i].dead) game.drops.splice(i, 1); }
  for (let i = game.orbs.length - 1; i >= 0; i--) { game.orbs[i].update(); if (game.orbs[i].dead) game.orbs.splice(i, 1); }
  for (let i = game.crates.length - 1; i >= 0; i--) { game.crates[i].update(); if (game.crates[i].dead) game.crates.splice(i, 1); }
  for (let i = game.shockwaves.length - 1; i >= 0; i--) { const s = game.shockwaves[i]; s.r += (s.maxR - s.r) * 0.2; s.life--; if (s.damaging) { for (const e of game.enemies) { if (e.dead || (s.hit && s.hit.has(e))) continue; if (dist(s, e) < s.r + e.radius && dist(s, e) > s.r - e.radius - 10) { e.takeDamage(s.damage); if (!s.hit) s.hit = new Set(); s.hit.add(e); } } } if (s.life <= 0) game.shockwaves.splice(i, 1); }
  for (let i = game.lightnings.length - 1; i >= 0; i--) { game.lightnings[i].life--; if (game.lightnings[i].life <= 0) game.lightnings.splice(i, 1); }
  updateFloaters();
  if (game.enemiesToSpawn > 0) { game.spawnTimer--; if (game.spawnTimer <= 0) { const batch = Math.min(game.enemiesToSpawn, 1 + Math.floor(game.wave / 5)); for (let i = 0; i < batch; i++) spawnEnemy(); game.enemiesToSpawn -= batch; game.spawnTimer = Math.max(12, 50 - game.wave); } }
  if (!game.crateTimer) game.crateTimer = 600; game.crateTimer--; if (game.crateTimer <= 0 && game.crates.length < 2) { spawnCrate(); game.crateTimer = 800 + Math.floor(Math.random() * 500); }
  if (game.enemiesToSpawn === 0 && game.enemies.length === 0) { if (game.waveTimer <= 0) game.waveTimer = 80; else { game.waveTimer--; if (game.waveTimer === 0) startWave(); } }
  game.shake *= 0.85; if (game.shake < 0.1) game.shake = 0;
  updateHUD();
}

function render() {
  ctx.save();
  if (game.shake > 0.1) ctx.translate(rand(-game.shake, game.shake), rand(-game.shake, game.shake));
  ctx.fillStyle = 'rgba(13, 12, 10, 0.4)'; ctx.fillRect(-50, -50, canvas.width + 100, canvas.height + 100);
  drawBackground();
  for (const s of game.shockwaves) { const a = s.life / 20; ctx.strokeStyle = `rgba(255, 120, 40, ${a})`; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, TAU); ctx.stroke(); if (s.damaging) { ctx.strokeStyle = `rgba(255, 200, 100, ${a * 0.5})`; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(s.x, s.y, s.r - 5, 0, TAU); ctx.stroke(); } }
  for (const l of game.lightnings) { const a = l.life / 7; ctx.strokeStyle = `rgba(180, 100, 255, ${a})`; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(l.x1, l.y1); const segs = 6; for (let i = 1; i < segs; i++) { const t = i / segs; const x = l.x1 + (l.x2 - l.x1) * t + rand(-8, 8); const y = l.y1 + (l.y2 - l.y1) * t + rand(-8, 8); ctx.lineTo(x, y); } ctx.lineTo(l.x2, l.y2); ctx.stroke(); }
  game.crates.forEach(c => c.draw()); game.drops.forEach(d => d.draw()); game.orbs.forEach(o => o.draw());
  if (game.state !== 'menu') {
    game.particles.filter(p => p.type === 'shell' || p.type === 'smoke').forEach(p => p.draw());
    game.particles.filter(p => p.type === 'flame').forEach(p => p.draw());
    game.particles.filter(p => p.type !== 'shell' && p.type !== 'smoke' && p.type !== 'flame').forEach(p => p.draw());
    game.bullets.forEach(b => b.draw()); game.enemies.forEach(e => e.draw());
    if (game.player) game.player.draw(); drawFloaters();
  }
  const boss = game.enemies.find(e => e.isBoss);
  if (boss && !boss.dead) {
    const w = canvas.width * 0.6; const x = (canvas.width - w) / 2; const y = 60;
    ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fillRect(x - 2, y - 2, w + 4, 24);

    const grad = ctx.createLinearGradient(x, y, x + w, y); grad.addColorStop(0, '#7a0a0a'); grad.addColorStop(0.5, '#c41e3a'); grad.addColorStop(1, '#ff5252');

  }

function drawBackground() {
  const size = 50;
  ctx.strokeStyle = 'rgba(74, 70, 50, 0.06)'; ctx.lineWidth = 1;
  for (let x = 0; x < canvas.width; x += size) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke(); }
  for (let y = 0; y < canvas.height; y += size) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke(); }
  ctx.strokeStyle = 'rgba(74, 70, 50, 0.12)';
  for (let x = 0; x < canvas.width; x += size * 4) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke(); }
  for (let y = 0; y < canvas.height; y += size * 4) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke(); }
  if (game.player) { const grad = ctx.createRadialGradient(game.player.x, game.player.y, 0, game.player.x, game.player.y, 280); grad.addColorStop(0, 'rgba(106, 138, 170, 0.05)'); grad.addColorStop(1, 'rgba(0, 0, 0, 0)'); ctx.fillStyle = grad; ctx.fillRect(0, 0, canvas.width, canvas.height); }

function drawCrosshair() {
  const x = game.mouse.x, y = game.mouse.y;
  const firing = game.player && game.player.fireTimer > game.player.effectiveFireRate - 4;
  const baseColor = firing ? '#ffb800' : '#e4b041';

function updateHUD() {

  }

  const hint = document.getElementById('crate-hint');
  const existingItems = hint.querySelectorAll('.crate-item:not(.fade)');
  if (existingItems.length === 0 && game.crates.length > 0) { for (const c of game.crates) { const d = Math.floor(dist(c, p) / 10); const item = document.createElement('div'); item.className = 'crate-item ' + c.type; item.dataset.crateId = c.x + '_' + c.y; item.innerHTML = `${c.type === 'weapon' ? '武器箱' : '技能箱'}<span class="dist">${d}m</span>`; hint.appendChild(item); } }
  else { game.crates.forEach(c => { const items = hint.querySelectorAll('.crate-item:not(.fade)'); items.forEach(item => { if (item.dataset.crateId == c.x + '_' + c.y) { const d = Math.floor(dist(c, p) / 10); item.querySelector('.dist').textContent = d + 'm'; } }); }); }
  const allItems = hint.querySelectorAll('.crate-item:not(.fade)');
  allItems.forEach(item => { const id = item.dataset.crateId; const stillExists = game.crates.some(c => c.x + '_' + c.y == id); if (!stillExists) { item.classList.add('fade'); setTimeout(() => item.remove(), 500); } });
}

function loop() { update(); render(); requestAnimationFrame(loop); }

window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase(); game.keys[k] = true;
  if (k === 'r' && game.state === 'playing') game.player.startReload();
  if (k === 'q' && game.state === 'playing') game.player.switchWeapon();
  if (k === 'escape' && (game.state === 'playing' || game.state === 'paused')) togglePause();
  if (k === ' ' && game.state === 'menu') startGame();
});
window.addEventListener('keyup', e => { game.keys[e.key.toLowerCase()] = false; });
window.addEventListener('mousemove', e => { game.mouse.x = e.clientX; game.mouse.y = e.clientY; });
window.addEventListener('mousedown', e => { if (e.button === 0 && game.state === 'playing' && !isTouch) game.mouse.down = true; });
window.addEventListener('mouseup', e => { if (e.button === 0) game.mouse.down = false; });
window.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('blur', () => { game.keys = {}; game.mouse.down = false; });

document.getElementById('start-btn').addEventListener('click', startGame);
document.getElementById('restart-btn').addEventListener('click', startGame);

loop();
</script>
</body>
</html>
