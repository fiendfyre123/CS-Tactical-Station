<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>BLACKOUT 战术行动</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0d0f13; touch-action: none; }
  body { font-family: 'Noto Sans SC', sans-serif; color: #c8ccd4; cursor: none; user-select: none; }
  #game { display: block; position: absolute; inset: 0; }
  .hidden { display: none !important; }

  #damage-flash {
    position: absolute; inset: 0; pointer-events: none; z-index: 5;
    background: radial-gradient(ellipse at center, transparent 45%, rgba(180, 30, 30, 0.55) 100%);
    opacity: 0; transition: opacity 0.35s ease-out;
  }
  #damage-flash.show { opacity: 1; transition: none; }
  #pickup-flash {
    position: absolute; inset: 0; pointer-events: none; z-index: 6;
    background: radial-gradient(ellipse at center, rgba(255, 184, 0, 0.3) 0%, transparent 60%);
    opacity: 0; transition: opacity 0.5s ease-out;
  }
  #pickup-flash.show { opacity: 1; transition: none; }
  #vignette {
    position: absolute; inset: 0; pointer-events: none; z-index: 4;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, 0.7) 100%);
  }

  #hud { position: absolute; inset: 0; pointer-events: none; z-index: 10; }

  .hud-top {
    position: absolute; top: 14px; left: 0; right: 0;
    display: flex; justify-content: space-between;
    padding: 0 16px; gap: 8px;
  }
  .hud-top > div {
    background: rgba(15, 17, 22, 0.88);
    border-left: 3px solid #d4a017;
    padding: 5px 14px 6px;
    min-width: 100px;
    backdrop-filter: blur(6px);
  }
  .hud-top .right { border-left: none; border-right: 3px solid #c41e3a; text-align: right; }
  .hud-top .center { border-left: none; border-bottom: 2px solid #4a6a8a; text-align: center; }
  .hud-top .center .value { color: #6a8aaa; }
  .label { font-size: 9px; letter-spacing: 0.2em; color: #6b7280; font-weight: 700; }
  .value { font-family: 'JetBrains Mono', monospace; font-size: 20px; color: #e4b041; margin-top: 1px; line-height: 1; }
  .value.danger { color: #ff5252; }
  .value.info { color: #6a8aaa; }

  .hud-bl { position: absolute; bottom: 18px; left: 16px; width: 320px; }
  .level-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 3px; }
  .lvl-text { font-weight: 900; font-size: 13px; color: #ffb800; letter-spacing: 0.1em; }
  .lvl-text span { font-family: 'JetBrains Mono'; font-size: 16px; }
  .xp-text { font-family: 'JetBrains Mono'; font-size: 10px; color: #8a7a40; }
  .xp-bar { height: 5px; background: rgba(0,0,0,0.6); border: 1px solid rgba(255,184,0,0.3); margin-bottom: 8px; overflow: hidden; }
  .xp-fill { height: 100%; background: linear-gradient(90deg, #ff8800, #ffb800, #ffd84a); width: 0%; transition: width 0.2s ease; }

  .hp-block {
    background: rgba(15, 17, 22, 0.88);
    border-left: 3px solid #c41e3a;
    padding: 8px 12px; backdrop-filter: blur(6px);
  }
  .hp-label { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 5px; }
  .hp-text { font-family: 'JetBrains Mono'; font-weight: 700; font-size: 13px; color: #ff5252; }
  .hp-bar { height: 12px; background: rgba(0,0,0,0.7); border: 1px solid rgba(196,30,58,0.4); overflow: hidden; position: relative; }
  .hp-fill { height: 100%; background: linear-gradient(90deg, #6b0e1e, #c41e3a, #e23636); width: 100%; transition: width 0.2s ease; }
  .hp-tick { position: absolute; top: 0; bottom: 0; width: 1px; background: rgba(0,0,0,0.4); }

  .skills-row { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 6px; max-width: 320px; }
  .skill-chip {
    background: rgba(15, 17, 22, 0.88);
    border: 1px solid #4a6a8a; padding: 2px 7px;
    font-size: 10px; color: #6a8aaa; letter-spacing: 0.05em;
    font-family: 'JetBrains Mono';
  }
  .skill-chip.epic { border-color: #8a4aaa; color: #b347d9; }
  .skill-chip.legendary { border-color: #ffb800; color: #ffb800; }

  .hud-br { position: absolute; bottom: 18px; right: 16px; }
  .weapon-block {
    background: rgba(15, 17, 22, 0.88);
    border-right: 3px solid #d4a017;
    padding: 8px 14px; text-align: right;
    min-width: 180px; position: relative;
    backdrop-filter: blur(6px);
  }
  .weapon-name { font-weight: 900; font-size: 15px; color: #e4b041; letter-spacing: 0.05em; }
  .weapon-upgrades { font-size: 10px; color: #6b7280; margin-top: 1px; font-family: 'JetBrains Mono'; }
  .ammo { font-family: 'JetBrains Mono'; font-weight: 700; font-size: 26px; margin-top: 2px; color: #f0d060; line-height: 1; }
  .ammo-sep { color: #4a4030; margin: 0 4px; font-weight: 400; }
  .ammo-low { color: #ff5252; }
  .ammo-infinite { color: #b347d9; font-size: 22px; }
  .reload-hint {
    position: absolute; top: -20px; right: 4px;
    font-size: 10px; letter-spacing: 0.2em;
    color: #ff7a18; font-weight: 700;
    opacity: 0; transition: opacity 0.15s;
  }
  .reload-hint.show { opacity: 1; animation: blink 0.5s infinite alternate; }
  @keyframes blink { to { opacity: 0.3; } }

  #killfeed {
    position: absolute; top: 80px; right: 16px;
    z-index: 11; pointer-events: none;
    display: flex; flex-direction: column; gap: 3px;
    align-items: flex-end;
  }
  .kill-item {
    background: rgba(15, 17, 22, 0.88);
    border-right: 2px solid #d4a017;
    padding: 3px 10px;
    font-family: 'JetBrains Mono'; font-size: 11px; color: #e4b041;
    animation: killSlide 0.3s ease-out;
  }
  @keyframes killSlide { from { transform: translateX(40px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  .kill-item.fade { animation: killFade 0.5s ease-out forwards; }
  @keyframes killFade { to { opacity: 0; transform: translateX(40px); } }

  #crate-hint {
    position: absolute; top: 80px; left: 16px;
    z-index: 11; pointer-events: none;
    display: flex; flex-direction: column; gap: 3px;
  }
  .crate-item {
    background: rgba(15, 17, 22, 0.88);
    border-left: 2px solid;
    padding: 3px 10px;
    font-family: 'JetBrains Mono'; font-size: 11px;
    letter-spacing: 0.05em;
    animation: crateSlide 0.3s ease-out;
  }
  @keyframes crateSlide { from { transform: translateX(-40px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  .crate-item.weapon { border-color: #d4a017; color: #d4a017; }
  .crate-item.skill { border-color: #b347d9; color: #b347d9; }
  .crate-item .dist { color: #6b7280; font-size: 9px; margin-left: 5px; }

  /* 升级面板 */
  #levelup {
    position: absolute; inset: 0; z-index: 30;
    background: rgba(8, 10, 14, 0.82);
    backdrop-filter: blur(8px);
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; cursor: default; padding: 20px;
  }
  #levelup.show { animation: fadeIn 0.3s ease-out; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .lv-header { text-align: center; margin-bottom: 24px; }
  .lv-tag { font-size: 12px; letter-spacing: 0.4em; color: #ff7a18; font-weight: 700; }
  .lv-title {
    font-size: 42px; font-weight: 900;
    color: #ffb800; letter-spacing: 0.05em;
    text-shadow: 0 0 20px rgba(255, 184, 0, 0.4);
    line-height: 1.1; margin-top: 4px;
  }
  .lv-sub { font-family: 'JetBrains Mono'; font-size: 12px; color: #6b7280; margin-top: 6px; }

  .upgrade-cards { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; max-width: 800px; }
  .upgrade-card {
    width: 210px; height: 300px;
    background: linear-gradient(180deg, #1c1f26 0%, #15171c 100%);
    border: 1px solid #2a2e38;
    border-top: 3px solid #4a4a4a;
    padding: 20px 16px;
    cursor: pointer;
    display: flex; flex-direction: column;
    align-items: center; text-align: center;
    transition: all 0.2s ease;
    position: relative; overflow: hidden;
  }
  .upgrade-card::before {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(180deg, transparent 0%, rgba(255, 184, 0, 0.04) 100%);
    pointer-events: none;
  }
  .upgrade-card:hover {
    transform: translateY(-6px);
    border-color: #ffb800;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6), 0 0 20px rgba(255, 184, 0, 0.15);
  }
  .upgrade-card.common { border-top-color: #8a92a6; }
  .upgrade-card.rare { border-top-color: #4a90e2; }
  .upgrade-card.epic { border-top-color: #b347d9; }
  .upgrade-card.legendary { border-top-color: #ffb800; }
  .uc-rarity { font-size: 10px; letter-spacing: 0.3em; font-weight: 700; margin-bottom: 14px; text-transform: uppercase; }
  .upgrade-card.common .uc-rarity { color: #8a92a6; }
  .upgrade-card.rare .uc-rarity { color: #4a90e2; }
  .upgrade-card.epic .uc-rarity { color: #b347d9; }
  .upgrade-card.legendary .uc-rarity { color: #ffb800; }
  .uc-icon {
    width: 70px; height: 70px;
    border: 2px solid currentColor;
    display: flex; align-items: center; justify-content: center;
    font-family: 'JetBrains Mono'; font-size: 24px;
    font-weight: 700; margin-bottom: 14px;
    transform: rotate(45deg);
  }
  .uc-icon > span { transform: rotate(-45deg); }
  .upgrade-card.common .uc-icon { color: #8a92a6; }
  .upgrade-card.rare .uc-icon { color: #4a90e2; }
  .upgrade-card.epic .uc-icon { color: #b347d9; }
  .upgrade-card.legendary .uc-icon { color: #ffb800; }
  .uc-name { font-size: 16px; font-weight: 900; color: #e8eaed; letter-spacing: 0.05em; margin-bottom: 8px; line-height: 1.2; }
  .uc-desc { font-size: 12px; color: #9aa0a8; line-height: 1.4; flex-grow: 1; }
  .uc-stack { font-family: 'JetBrains Mono'; font-size: 10px; color: #6b7280; margin-top: 10px; letter-spacing: 0.1em; }

  /* 菜单 */
  .overlay {
    position: absolute; inset: 0; z-index: 20;
    background:
      radial-gradient(ellipse at 25% 30%, rgba(212, 160, 23, 0.08) 0%, transparent 50%),
      radial-gradient(ellipse at 75% 70%, rgba(196, 30, 58, 0.06) 0%, transparent 50%),
      radial-gradient(ellipse at center, rgba(15, 17, 22, 0.92) 0%, rgba(8, 10, 14, 0.98) 70%);
    backdrop-filter: blur(8px);
    display: flex; align-items: center; justify-content: center; cursor: default; padding: 20px;
  }
  .menu-content { text-align: center; padding: 30px; max-width: 600px; }
  .title-bar { width: 50px; height: 3px; background: #d4a017; margin: 0 auto 18px; }
  .game-title { font-size: 76px; font-weight: 900; line-height: 0.9; letter-spacing: 0.04em; color: #e8eaed; }
  .game-title span { color: #d4a017; text-shadow: 0 0 24px rgba(212, 160, 23, 0.5); display: block; }
  .game-sub { font-family: 'JetBrains Mono'; font-size: 11px; letter-spacing: 0.3em; color: #6b7280; margin-top: 12px; }
  .controls-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin: 24px auto; max-width: 440px; }
  .ctrl {
    display: flex; align-items: center; gap: 10px;
    padding: 7px 12px;
    background: rgba(212, 160, 23, 0.04);
    border-left: 2px solid rgba(212, 160, 23, 0.3);
  }
  .ctrl kbd {
    font-family: 'JetBrains Mono'; font-weight: 700;
    font-size: 10px; background: rgba(212, 160, 23, 0.08);
    border: 1px solid rgba(212, 160, 23, 0.3);
    padding: 3px 9px; color: #d4a017;
    letter-spacing: 0.1em; min-width: 64px; text-align: center;
  }
  .ctrl span { font-size: 12px; color: #9aa0a8; }

  .cta-btn {
    font-family: 'Noto Sans SC'; font-weight: 900;
    font-size: 16px; letter-spacing: 0.18em;
    background: transparent; color: #d4a017;
    border: 2px solid #d4a017;
    padding: 14px 44px; cursor: pointer;
    position: relative; overflow: hidden;
    transition: color 0.3s, box-shadow 0.3s;
    margin-top: 4px;
  }
  .cta-btn::before {
    content: ''; position: absolute; inset: 0;
    background: #d4a017;
    transform: translateX(-101%);
    transition: transform 0.3s ease; z-index: 0;
  }
  .cta-btn > span { position: relative; z-index: 1; }
  .cta-btn:hover { color: #0d0f13; box-shadow: 0 0 30px rgba(212, 160, 23, 0.4); }
  .cta-btn:hover::before { transform: translateX(0); }
  .hint { margin-top: 18px; font-size: 12px; color: #4b5563; }

  .over-title { font-size: 64px; font-weight: 900; color: #c41e3a; letter-spacing: 0.05em; text-shadow: 0 0 24px rgba(196, 30, 58, 0.5); margin-bottom: 4px; }
  .over-sub { font-family: 'JetBrains Mono'; font-size: 11px; letter-spacing: 0.3em; color: #6b7280; margin-bottom: 26px; }
  .stats { display: flex; flex-direction: column; gap: 5px; margin: 18px 0 24px; align-items: center; }
  .stat {
    display: flex; justify-content: space-between; align-items: center;
    width: 340px; padding: 10px 18px;
    background: rgba(196, 30, 58, 0.04);
    border-left: 2px solid rgba(196, 30, 58, 0.3);
  }
  .stat-label { font-size: 11px; letter-spacing: 0.18em; color: #6b7280; font-weight: 700; }
  .stat-value { font-family: 'JetBrains Mono'; font-weight: 700; font-size: 20px; color: #e23636; }

  /* 手机控制按钮 */
  #mobile-ui {
    position: absolute; inset: 0; z-index: 15;
    pointer-events: none; display: none;
  }
  #mobile-ui.active { display: block; }
  .joystick-base {
    position: absolute; width: 120px; height: 120px;
    border: 2px solid rgba(212, 160, 23, 0.4);
    border-radius: 50%; background: rgba(15, 17, 22, 0.3);
    pointer-events: none;
  }
  .joystick-stick {
    position: absolute; width: 50px; height: 50px;
    border: 2px solid rgba(212, 160, 23, 0.8);
    background: rgba(212, 160, 23, 0.3);
    border-radius: 50%; pointer-events: none;
  }
  .joystick-base.right { border-color: rgba(196, 30, 58, 0.4); }
  .joystick-stick.right { border-color: rgba(196, 30, 58, 0.8); background: rgba(196, 30, 58, 0.3); }
  #reload-mobile {
    position: absolute; bottom: 160px; right: 16px;
    width: 60px; height: 60px;
    background: rgba(15, 17, 22, 0.85);
    border: 2px solid #d4a017;
    color: #d4a017; font-weight: 900; font-size: 11px;
    border-radius: 50%; pointer-events: auto;
    cursor: pointer;
    font-family: 'Noto Sans SC';
  }
  #reload-mobile:active { background: rgba(212, 160, 23, 0.3); }
</style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="vignette"></div>
  <div id="damage-flash"></div>
  <div id="pickup-flash"></div>

  <div id="hud" class="hidden">
    <div class="hud-top">
      <div><div class="label">得分</div><div class="value" id="score">0</div></div>
      <div class="center"><div class="label">波次</div><div class="value info" id="wave">1</div></div>
      <div class="right"><div class="label">敌人</div><div class="value danger" id="enemies">0</div></div>
    </div>

    <div id="killfeed"></div>
    <div id="crate-hint"></div>

    <div class="hud-bl">
      <div class="level-row">
        <span class="lvl-text">等级 <span id="lvl">1</span></span>
        <span class="xp-text" id="xp-text">0 / 50</span>
      </div>
      <div class="xp-bar"><div class="xp-fill" id="xp-fill"></div></div>
      <div class="hp-block">
        <div class="hp-label">
          <span class="label">生命</span>
          <span class="hp-text" id="hp-text">100/100</span>
        </div>
        <div class="hp-bar">
          <div class="hp-fill" id="hp-fill"></div>
          <div class="hp-tick" style="left: 25%"></div>
          <div class="hp-tick" style="left: 50%"></div>
          <div class="hp-tick" style="left: 75%"></div>
        </div>
      </div>
      <div class="skills-row" id="skills-row"></div>
    </div>

    <div class="hud-br">
      <div class="weapon-block">
        <div class="reload-hint" id="reload-hint">装弹中</div>
        <div class="weapon-name" id="weapon-name">GLOCK-18</div>
        <div class="weapon-upgrades" id="weapon-upgrades">等级 1 / 5</div>
        <div class="ammo" id="ammo-display">
          <span id="ammo-mag">12</span><span class="ammo-sep">/</span><span id="ammo-mag-max">12</span>
        </div>
      </div>
    </div>
  </div>

  <div id="mobile-ui">
    <button id="reload-mobile">装弹</button>
  </div>

  <div id="levelup" class="hidden">
    <div class="lv-header">
      <div class="lv-tag" id="lv-tag">升级</div>
      <div class="lv-title" id="lv-title">等级 2</div>
      <div class="lv-sub" id="lv-sub">选择一项强化部署</div>
    </div>
    <div class="upgrade-cards" id="upgrade-cards"></div>
  </div>

  <div id="menu" class="overlay">
    <div class="menu-content">
      <div class="title-bar"></div>
      <h1 class="game-title">战术<span>行動</span></h1>
      <p class="game-sub">BLACKOUT · 无限波次 · v4.1</p>
      <div class="controls-grid">
        <div class="ctrl"><kbd>W A S D</kbd><span>战术移动</span></div>
        <div class="ctrl"><kbd>鼠标</kbd><span>瞄准方向</span></div>
        <div class="ctrl"><kbd>左键</kbd><span>开火</span></div>
        <div class="ctrl"><kbd>R</kbd><span>装弹</span></div>
      </div>
      <button id="start-btn" class="cta-btn"><span>出击</span></button>
      <div class="hint">手机端：左屏摇杆移动 · 右屏摇杆瞄准开火 · 中下方装弹按钮</div>
    </div>
  </div>

  <div id="gameover" class="overlay hidden">
    <div class="menu-content">
      <h1 class="over-title">阵亡</h1>
      <p class="over-sub">KIA · 任务失败</p>
      <div class="stats">
        <div class="stat"><span class="stat-label">最终得分</span><span class="stat-value" id="final-score">0</span></div>
        <div class="stat"><span class="stat-label">抵达波次</span><span class="stat-value" id="final-wave">1</span></div>
        <div class="stat"><span class="stat-label">角色等级</span><span class="stat-value" id="final-lvl">1</span></div>
        <div class="stat"><span class="stat-label">总击杀</span><span class="stat-value" id="final-kills">0</span></div>
      </div>
      <button id="restart-btn" class="cta-btn"><span>重新出击</span></button>
    </div>
  </div>

<script>
// ===================== 工具 =====================
const rand = (a, b) => Math.random() * (b - a) + a;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const TAU = Math.PI * 2;

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
window.addEventListener('resize', resize);
resize();

// 触屏检测
const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
if (isTouch) {
  document.getElementById('mobile-ui').classList.add('active');
  document.body.style.cursor = 'default';
}

// ===================== 武器（CS 风格）=====================
const WEAPONS = {
  glock: { name: 'GLOCK-18', damage: 22, fireRate: 10, bulletSpeed: 18, magSize: 17, spread: 0.06, auto: false, color: '#ffd870', size: 2.5, pellets: 1, life: 50, shake: 1, recoil: 0.8, reloadTime: 35 },
  deagle:{ name: 'DESERT EAGLE', damage: 78, fireRate: 26, bulletSpeed: 20, magSize: 7, spread: 0.02, auto: false, color: '#ffaa44', size: 3.5, pellets: 1, life: 60, shake: 3.5, recoil: 2.5, reloadTime: 55 },
  mp9:   { name: 'MP9', damage: 14, fireRate: 4, bulletSpeed: 20, magSize: 30, spread: 0.12, auto: true, color: '#ffd070', size: 2.2, pellets: 1, life: 45, shake: 0.8, recoil: 0.4, reloadTime: 45 },
  nova:  { name: 'NOVA', damage: 12, fireRate: 32, bulletSpeed: 14, magSize: 8, spread: 0.38, auto: false, color: '#ff7755', size: 3, pellets: 9, life: 26, shake: 4.5, recoil: 3.5, reloadTime: 75 },
  m4a4:  { name: 'M4A4', damage: 28, fireRate: 6, bulletSpeed: 24, magSize: 30, spread: 0.04, auto: true, color: '#e4b041', size: 2.6, pellets: 1, life: 55, shake: 1.1, recoil: 0.7, reloadTime: 60 },

// ===================== Player =====================
class Player {
  constructor(x, y) {
    this.x = x; this.y = y; this.radius = 13;
    this.baseSpeed = 5.5;
    this.angle = 0;
    this.hp = 100; this.maxHp = 100;
    this.level = 1; this.xp = 0; this.xpToNext = 50; this.kills = 0;
    this.weaponKey = 'glock'; this.weaponTier = 1;
    this.ammo = WEAPONS.glock.magSize;
    this.fireTimer = 0; this.reloadTimer = 0;
    this.invuln = 0; this.muzzleFlash = 0; this.recoilOffset = 0; this.canFire = true;
    this.speedMult = 1; this.damageMult = 1; this.fireRateMult = 1;
    this.magMult = 1; this.reloadMult = 1; this.bulletSpeedMult = 1;
    this.spreadMult = 1; this.pickupRangeMult = 1; this.xpMult = 1;
    this.dropLuck = 1; this.critChance = 0; this.critMult = 1.75;
    this.regen = 0; this.lifesteal = 0; this.thorns = 0; this.rage = false;
    this.regenAcc = 0;
    this.skills = new Set();
    this.extraShots = 0; this.pierceBonus = 0;
    this.takenUpgrades = {};
    this.moveDir = { x: 0, y: 0 };
  }
  get weapon() { return WEAPONS[this.weaponKey]; }
  get weaponMods() { return WEAPON_UPGRADE_TREE[this.weaponTier]; }
  get speed() { return this.baseSpeed * this.speedMult * (this.rage && this.hp < this.maxHp * 0.35 ? 1.4 : 1); }
  get effectiveDamageMult() { return this.damageMult * this.weaponMods.damage * (this.rage && this.hp < this.maxHp * 0.35 ? 1.4 : 1); }
  get effectiveFireRate() { return Math.max(1, Math.floor(this.weapon.fireRate * this.fireRateMult * this.weaponMods.fireRate)); }
  get effectiveMag() { return Math.floor(this.weapon.magSize * this.magMult * this.weaponMods.magSize); }
  get effectiveReload() { return Math.floor(this.weapon.reloadTime * this.reloadMult); }
  get effectiveSpread() { return this.weapon.spread * this.spreadMult * this.weaponMods.spread; }
  get effectiveBulletSpeed() { return this.weapon.bulletSpeed * this.bulletSpeedMult * this.weaponMods.bulletSpeed; }
  get hasInfiniteAmmo() { return this.skills.has('infammo'); }
  get hasInfiniteRange() { return this.skills.has('infrange'); }
  get hasSplit() { return this.skills.has('split'); }
  get hasHoming() { return this.skills.has('homing'); }
  get hasBoomerang() { return this.skills.has('boomerang'); }
  get hasBounce() { return this.skills.has('bounce'); }
  get hasShock() { return this.skills.has('shock'); }
  get hasChain() { return this.skills.has('chain'); }
  get hasMulti() { return this.skills.has('multishot'); }
  get hasPoison() { return this.skills.has('poison'); }
  get hasFreeze() { return this.skills.has('freeze'); }

  update() {
    let dx = 0, dy = 0;
    if (game.keys['w'] || game.keys['arrowup']) dy -= 1;
    if (game.keys['s'] || game.keys['arrowdown']) dy += 1;
    if (game.keys['a'] || game.keys['arrowleft']) dx -= 1;
    if (game.keys['d'] || game.keys['arrowright']) dx += 1;
    // 触屏摇杆
    if (touchState.move.active) {
      const len = Math.hypot(touchState.move.dx, touchState.move.dy);
      if (len > 8) {
        dx = touchState.move.dx / len;
        dy = touchState.move.dy / len;
      }
    }
    if (dx !== 0 || dy !== 0) {
      const len = Math.hypot(dx, dy);
      dx /= len; dy /= len;
      this.x += dx * this.speed;
      this.y += dy * this.speed;
      this.moveDir = { x: dx, y: dy };
      if (game.time % 6 === 0) {
        game.particles.push(new Particle(this.x - dx * 10 + rand(-2, 2), this.y - dy * 10 + rand(-2, 2), rand(-0.3, 0.3), rand(-0.3, 0.3), 16, '#4a4a45', 1.4));
      }
    }
    this.x = clamp(this.x, this.radius, canvas.width - this.radius);
    this.y = clamp(this.y, this.radius, canvas.height - this.radius);

    // 瞄准
    if (touchState.aim.active) {
      const len = Math.hypot(touchState.aim.dx, touchState.aim.dy);
      if (len > 8) this.angle = Math.atan2(touchState.aim.dy, touchState.aim.dx);
    } else {
      this.angle = Math.atan2(game.mouse.y - this.y, game.mouse.x - this.x);
    }

    if (this.reloadTimer > 0 && !this.hasInfiniteAmmo) {
      this.reloadTimer--;
      if (this.reloadTimer === 0) this.ammo = this.effectiveMag;
    }
    if (this.regen > 0 && this.hp < this.maxHp) {
      this.regenAcc += this.regen / 60;
      if (this.regenAcc >= 1) {
        this.hp = Math.min(this.maxHp, this.hp + Math.floor(this.regenAcc));
        this.regenAcc -= Math.floor(this.regenAcc);
      }
    }
    if (this.fireTimer > 0) this.fireTimer--;
    if (this.muzzleFlash > 0) this.muzzleFlash--;
    if (this.recoilOffset > 0) this.recoilOffset *= 0.7;
    if (this.invuln > 0) this.invuln--;

    const firing = game.mouse.down || touchState.aim.active;
    if (firing && this.fireTimer <= 0 && this.reloadTimer <= 0) {
      if (this.hasInfiniteAmmo || this.ammo > 0) {
        if (this.weapon.auto || this.canFire) { this.fire(); this.canFire = false; }
      } else this.startReload();
    }
    if (!firing) this.canFire = true;
  }

  fire() {
    const w = this.weapon;
    this.fireTimer = this.effectiveFireRate;
    if (!this.hasInfiniteAmmo) this.ammo--;
    this.muzzleFlash = 6;
    this.recoilOffset = w.recoil;
    const totalPellets = w.pellets + (this.hasMulti ? 2 : 0) + this.extraShots;
    for (let i = 0; i < totalPellets; i++) {
      const spread = (Math.random() - 0.5) * this.effectiveSpread * 2;
      const angle = this.angle + spread;
      const isCrit = Math.random() < (this.critChance + (this.skills.has('critmaster') ? 0.3 : 0));
      const dmg = w.damage * this.effectiveDamageMult * (isCrit ? (this.skills.has('critmaster') ? 2.5 : this.critMult) : 1);
      const bx = this.x + Math.cos(this.angle) * (this.radius + 18);
      const by = this.y + Math.sin(this.angle) * (this.radius + 18);
      const bullet = new Bullet(bx, by, angle, {
        damage: dmg, color: w.color, glow: w.color,
        bulletSpeed: this.effectiveBulletSpeed,
        size: w.size, life: this.hasInfiniteRange ? 99999 : Math.floor(w.life * this.weaponMods.bulletSpeed),
        pierce: this.pierceBonus + (w.pierce || 0) + (this.skills.has('pierce') ? 5 : 0),
        bounce: this.hasBounce ? 3 : 0, homing: this.hasHoming, boomerang: this.hasBoomerang,
        split: this.hasSplit, shock: this.hasShock, chain: this.hasChain,
        poison: this.hasPoison, freeze: this.hasFreeze
      }, 'player');
      bullet.crit = isCrit;
      game.bullets.push(bullet);
    }
    // 枪口火焰
    for (let i = 0; i < 5; i++) {
      const a = this.angle + rand(-0.3, 0.3); const sp = rand(2, 5);
      game.particles.push(new Particle(this.x + Math.cos(this.angle) * (this.radius + 18), this.y + Math.sin(this.angle) * (this.radius + 18), Math.cos(a) * sp, Math.sin(a) * sp, 9, '#ffcc66', rand(1.8, 3.2)));
    }
    for (let i = 0; i < 2; i++) {
      const a = this.angle + rand(-0.4, 0.4);
      game.particles.push(new Particle(this.x + Math.cos(this.angle) * (this.radius + 18), this.y + Math.sin(this.angle) * (this.radius + 18), Math.cos(a) * 0.4, Math.sin(a) * 0.4 - 0.3, 22, '#666670', rand(2, 3.5), 'smoke'));
    }
    // 弹壳
    const ea = this.angle + Math.PI / 2 + rand(-0.15, 0.15);
    game.particles.push(new Particle(this.x + Math.cos(this.angle) * 6, this.y + Math.sin(this.angle) * 6, Math.cos(ea) * 2.2 + rand(-0.4, 0.4), Math.sin(ea) * 2.2 - 1.4, 35, '#ccaa55', 1.8, 'shell'));
    game.shake = Math.min(game.shake + w.shake, 10);
    this.x -= Math.cos(this.angle) * w.recoil * 0.22;
    this.y -= Math.sin(this.angle) * w.recoil * 0.22;
  }

  startReload() {
    if (this.hasInfiniteAmmo) return;
    if (this.reloadTimer > 0) return;
    if (this.ammo >= this.effectiveMag) return;
    this.reloadTimer = this.effectiveReload;
  }

  takeDamage(amount, source) {
    if (this.invuln > 0) return;
    this.hp -= amount;
    this.invuln = 25;
    game.shake = Math.min(game.shake + 4, 12);
    if (this.thorns > 0 && source && !source.dead) source.takeDamage(amount * this.thorns, true);
    const flash = document.getElementById('damage-flash');
    flash.classList.remove('show'); void flash.offsetWidth;
    flash.classList.add('show');
    setTimeout(() => flash.classList.remove('show'), 350);
    for (let i = 0; i < 12; i++) {
      const a = rand(0, TAU); const sp = rand(1, 4);
      game.particles.push(new Particle(this.x, this.y, Math.cos(a) * sp, Math.sin(a) * sp, 25, '#aa3030', rand(1.8, 3)));
    }
    if (this.hp <= 0) { this.hp = 0; gameOver(); }
  }

  heal(amount) {
    this.hp = Math.min(this.maxHp, this.hp + amount);
    for (let i = 0; i < 10; i++) {
      const a = rand(0, TAU);
      game.particles.push(new Particle(this.x, this.y, Math.cos(a) * 1, Math.sin(a) * 1 - 1, 28, '#4ad45a', rand(1.8, 2.8)));
    }
  }

  addXP(amount) {
    this.xp += Math.floor(amount * this.xpMult);
    while (this.xp >= this.xpToNext) {
      this.xp -= this.xpToNext;
      this.level++;
      this.xpToNext = Math.floor(50 * Math.pow(1.35, this.level - 1));
      triggerLevelUp();
    }
  }

  upgradeWeapon() {
    if (this.weaponTier < 5) {
      this.weaponTier++;
      this.ammo = this.effectiveMag;
      this.reloadTimer = 0;
    } else {
      const others = WEAPON_KEYS.filter(k => k !== this.weaponKey);
      const newW = others[Math.floor(Math.random() * others.length)];
      this.weaponKey = newW;
      this.weaponTier = 3;
      this.ammo = this.effectiveMag;
      this.reloadTimer = 0;
    }
  }

  addSkill(skillId) {
    this.skills.add(skillId);
    if (skillId === 'multishot') this.extraShots = 2;
    if (skillId === 'pierce') this.pierceBonus = 5;
    if (skillId === 'critmaster') { this.critChance += 0.3; this.critMult = 2.5; }
  }

  draw() {
    ctx.save();
    ctx.translate(this.x, this.y);
    // 阴影
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.beginPath();
    ctx.ellipse(0, 7, this.radius * 1.0, this.radius * 0.35, 0, 0, TAU);
    ctx.fill();
    ctx.rotate(this.angle);
    ctx.translate(-this.recoilOffset * 0.3, 0);

    const flicker = this.invuln > 0 && Math.floor(this.invuln / 3) % 2 === 0;
    const vestColor = flicker ? '#ff5252' : '#3a5a7a';
    const accent = flicker ? '#ff8888' : (this.skills.size > 0 ? '#b347d9' : '#6a8aaa');

    // 武器（横向）
    ctx.fillStyle = '#1a1d23';
    ctx.fillRect(this.radius - 2, -3, 22, 6);
    ctx.fillStyle = '#0a0c10';
    ctx.fillRect(this.radius + 18, -2.5, 5, 5);
    // 枪口火焰
    if (this.muzzleFlash > 0) {
      const f = this.muzzleFlash / 6;
      ctx.fillStyle = `rgba(255, 220, 100, ${f * 0.9})`;
      ctx.beginPath(); ctx.arc(this.radius + 24, 0, 8 * f + 3, 0, TAU); ctx.fill();
      ctx.fillStyle = `rgba(255, 255, 220, ${f * 0.7})`;
      ctx.beginPath(); ctx.arc(this.radius + 24, 0, 4 * f + 1, 0, TAU); ctx.fill();
    }
    // 身体（防弹衣 - 椭圆）
    ctx.fillStyle = vestColor;
    ctx.beginPath();
    ctx.ellipse(0, 0, this.radius * 0.85, this.radius * 0.95, 0, 0, TAU);
    ctx.fill();
    // 防弹衣条纹
    ctx.fillStyle = '#2a3a4a';
    ctx.fillRect(-this.radius * 0.7, -2, this.radius * 1.4, 4);
    // 头部（圆形 - 肤色）
    ctx.fillStyle = '#c89060';
    ctx.beginPath();
    ctx.arc(0, 0, this.radius * 0.55, 0, TAU);
    ctx.fill();
    // 头盔（半圆顶）
    ctx.fillStyle = '#2a3a4a';
    ctx.beginPath();
    ctx.arc(0, 0, this.radius * 0.55, Math.PI, TAU);
    ctx.fill();
    // 头盔条
    ctx.fillStyle = accent;
    ctx.fillRect(-this.radius * 0.55, -this.radius * 0.55, this.radius * 1.1, 1.5);
    // 朝向小三角
    ctx.fillStyle = accent;
    ctx.beginPath();
    ctx.moveTo(this.radius * 0.35, -2);
    ctx.lineTo(this.radius * 0.6, 0);
    ctx.lineTo(this.radius * 0.35, 2);
    ctx.closePath(); ctx.fill();

    ctx.restore();

    // 拾取范围
    if (this.pickupRangeMult > 1.3) {
      const range = 60 * this.pickupRangeMult;
      ctx.strokeStyle = `rgba(106, 138, 170, ${0.06 + 0.04 * Math.sin(game.time * 0.05)})`;
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(this.x, this.y, range, 0, TAU); ctx.stroke();
    }
  }
}

// ===================== 敌人 =====================
class Enemy {
  constructor(x, y, type, waveBonus) {
    this.x = x; this.y = y; this.type = type;
    const t = ENEMY_TYPES[type];
    Object.assign(this, t);
    // 【修改点】降低每波敌人的血量与伤害成长
    const buff = 1 + waveBonus * 0.05;
    this.hp = t.hp * buff;
    this.maxHp = this.hp;
    this.damage = t.damage * (1 + waveBonus * 0.03);
    this.angle = 0;
    this.dead = false;
    this.hitFlash = 0;
    this.spawnAnim = 18;
    this.attackCD = 0;
    this.fireTimer = Math.floor(Math.random() * 60) + 30;
    this.sideStep = Math.random() < 0.5 ? 1 : -1;
    this.healTimer = 0;
    this.slow = 0;
    this.poisonStacks = 0;
    this.poisonTimer = 0;
    this.burstCount = t.burstCount || 0;
    this.burstShotsLeft = 0;
    this.burstDelay = 0;
    this.flameParticles = 0;
  }

  update() {
    if (this.spawnAnim > 0) { this.spawnAnim--; return; }
    const p = game.player;
    const dx = p.x - this.x;
    const dy = p.y - this.y;
    const d = Math.hypot(dx, dy);
    this.angle = Math.atan2(dy, dx);

    const slowMult = this.slow > 0 ? 0.5 : 1;
    if (this.slow > 0) this.slow--;
    if (this.poisonStacks > 0) {
      this.poisonTimer--;
      if (this.poisonTimer <= 0) {
        this.takeDamage(this.poisonStacks * 2, true);
        this.poisonStacks = Math.max(0, this.poisonStacks - 1);
        this.poisonTimer = 30;
      }
    }

    const sp = this.speed * slowMult;
    switch (this.behavior) {
      case 'chase':
        if (d > 0.1) { this.x += (dx / d) * sp; this.y += (dy / d) * sp; }
        if (d < this.radius + p.radius + 2 && this.attackCD <= 0) {
          p.takeDamage(this.damage, this); this.attackCD = 25;
        }
        break;
      case 'shooter':
        const desired = this.sniper ? 380 : (this.weapon === 'shotgun' ? 160 : 250);
        if (d < desired - 30) { this.x -= (dx / d) * sp; this.y -= (dy / d) * sp; }
        else if (d > desired + 50) { this.x += (dx / d) * sp; this.y += (dy / d) * sp; }
        else { this.x += -dy / d * sp * 0.5 * this.sideStep; this.y += dx / d * sp * 0.5 * this.sideStep; }
        if (d < this.range) {
          if (this.burstShotsLeft > 0) {
            this.burstDelay--;
            if (this.burstDelay <= 0) {
              this.shoot();
              this.burstShotsLeft--;
              this.burstDelay = this.burstDelay === 0 ? 6 : 6;
            }
            if (this.burstShotsLeft === 0) this.fireTimer = this.fireRate;
          } else {
            this.fireTimer--;
            if (this.fireTimer <= 0) {
              if (this.burstCount > 0) {
                this.burstShotsLeft = this.burstCount;
                this.burstDelay = 0;
              } else {
                this.shoot();
                this.fireTimer = this.fireRate;
              }
            }
          }
        }
        if (this.sniper && this.fireTimer < 25 && d < this.range) {
          // 激光指示
        }
        break;
      case 'bomber':
        if (d > 0.1) { this.x += (dx / d) * sp; this.y += (dy / d) * sp; }
        if (d < this.explodeRadius * 0.7) this.explode();
        break;
      case 'medic':
        let target = null, minD = Infinity;
        for (const e of game.enemies) {
          if (e === this || e.dead || e.type === 'medic') continue;
          const ed = dist(this, e);
          if (ed < minD) { minD = ed; target = e; }
        }
        if (target) {
          const tdx = target.x - this.x, tdy = target.y - this.y;
          const td = Math.hypot(tdx, tdy);
          if (td > 40) { this.x += (tdx / td) * sp; this.y += (tdy / td) * sp; }
          this.healTimer--;
          if (this.healTimer <= 0) {
            this.healTimer = this.healRate;
            for (const e of game.enemies) {
              if (e === this || e.dead) continue;
              if (dist(this, e) < this.healRange) {
                e.hp = Math.min(e.maxHp, e.hp + this.healAmount);
                const ang = Math.atan2(e.y - this.y, e.x - this.x);
                game.particles.push(new Particle(this.x + Math.cos(ang) * 8, this.y + Math.sin(ang) * 8, Math.cos(ang) * 2, Math.sin(ang) * 2, 18, '#4ad45a', 2));
              }
            }
          }
        } else {
          if (d > 0.1) { this.x += (dx / d) * sp; this.y += (dy / d) * sp; }
        }
        if (d < this.radius + p.radius + 2 && this.attackCD <= 0) {
          p.takeDamage(this.damage, this); this.attackCD = 25;
        }
        break;
      case 'flamer':
        const fdesired = 130;
        if (d > fdesired + 20) { this.x += (dx / d) * sp; this.y += (dy / d) * sp; }
        else if (d < fdesired - 30) { this.x -= (dx / d) * sp; this.y -= (dy / d) * sp; }
        else { this.x += -dy / d * sp * 0.4 * this.sideStep; this.y += dx / d * sp * 0.4 * this.sideStep; }
        // 喷火
        if (d < this.flameRange) {
          this.flameParticles++;
          if (this.flameParticles >= 2) {
            this.flameParticles = 0;
            // 创建火焰粒子
            for (let i = 0; i < 3; i++) {
              const a = this.angle + rand(-0.25, 0.25);
              const sp2 = rand(3, 7);
              game.particles.push(new Particle(
                this.x + Math.cos(this.angle) * (this.radius + 8),
                this.y + Math.sin(this.angle) * (this.radius + 8),
                Math.cos(a) * sp2, Math.sin(a) * sp2,
                25, i === 0 ? '#ff4400' : (i === 1 ? '#ff8800' : '#ffcc00'), rand(3, 5), 'flame'
              ));
            }
            // 火焰伤害检查
            if (d < this.flameRange) {
              const angDiff = Math.abs(((this.angle - Math.atan2(dy, dx) + Math.PI) % TAU) - Math.PI);
              if (angDiff < 0.4) {
                p.takeDamage(this.flameDamage, this);
              }
            }
          }
        }
        break;
    }
    if (this.attackCD > 0) this.attackCD--;
    if (this.hitFlash > 0) this.hitFlash--;
  }

  shoot() {
    const ang = this.angle + rand(-0.05, 0.05);
    const bx = this.x + Math.cos(this.angle) * (this.radius + 12);
    const by = this.y + Math.sin(this.angle) * (this.radius + 12);
    if (this.pellets) {
      // 散弹
      for (let i = 0; i < this.pellets; i++) {
        const s = (Math.random() - 0.5) * this.spread * 2;
        game.bullets.push(new Bullet(bx, by, ang + s, {
          color: this.accent, glow: this.accent, damage: this.bulletDamage,
          bulletSpeed: this.bulletSpeed, size: 3, life: 35
        }, 'enemy'));
      }
    } else {
      game.bullets.push(new Bullet(bx, by, ang, {
        color: this.accent, glow: this.accent, damage: this.bulletDamage,
        bulletSpeed: this.bulletSpeed, size: this.sniper ? 4.5 : 3.2,
        life: this.sniper ? 120 : 80
      }, 'enemy'));
    }
    for (let i = 0; i < 3; i++) {
      const a = this.angle + rand(-0.3, 0.3);
      game.particles.push(new Particle(bx, by, Math.cos(a) * rand(1, 3), Math.sin(a) * rand(1, 3), 7, this.accent, rand(1, 1.8)));
    }
  }

  explode() {
    this.dead = true;
    const p = game.player;
    const d = dist(this, p);
    if (d < this.explodeRadius) p.takeDamage(this.damage * (1 - d / this.explodeRadius), this);
    for (let i = 0; i < 40; i++) {
      const a = rand(0, TAU); const sp = rand(2, 8);
      game.particles.push(new Particle(this.x, this.y, Math.cos(a) * sp, Math.sin(a) * sp, 45, i % 2 ? '#ff7a18' : '#ffcc44', rand(2, 5)));
    }
    for (let i = 0; i < 12; i++) {
      const a = rand(0, TAU);
      game.particles.push(new Particle(this.x, this.y, Math.cos(a) * rand(0.5, 2), Math.sin(a) * rand(0.5, 2) - 1, 55, '#444450', rand(3, 5), 'smoke'));
    }
    game.shake = Math.min(game.shake + 6, 12);
    game.shockwaves.push({ x: this.x, y: this.y, r: 5, maxR: this.explodeRadius, life: 18 });
  }

  takeDamage(amount, fromDot) {
    if (this.dead) return;
    if (this.shield && !fromDot) {
      const p = game.player;
      const angToP = Math.atan2(p.y - this.y, p.x - this.x);
      const diff = Math.abs(((this.angle - angToP + Math.PI) % TAU) - Math.PI);
      if (diff < 0.9) {
        amount *= (1 - this.shield);
        const shieldX = this.x + Math.cos(this.angle) * (this.radius + 4);
        const shieldY = this.y + Math.sin(this.angle) * (this.radius + 4);
        for (let i = 0; i < 3; i++) {
          const a = rand(0, TAU);
          game.particles.push(new Particle(shieldX, shieldY, Math.cos(a) * 2, Math.sin(a) * 2, 9, '#4a90e2', rand(1, 2)));
        }
      }
    }
    this.hp -= amount;
    this.hitFlash = 4;
    floaters.push({
      x: this.x + rand(-8, 8), y: this.y - this.radius - 4,
      text: Math.ceil(amount), life: 32, maxLife: 32,
      vy: -1.4, color: amount > 50 ? '#ff5252' : '#ffcc44', size: amount > 50 ? 15 : 12
    });
    for (let i = 0; i < 4; i++) {
      const a = rand(0, TAU); const sp = rand(1, 3);
      game.particles.push(new Particle(this.x, this.y, Math.cos(a) * sp, Math.sin(a) * sp, 18, '#aa3030', rand(1.5, 2.5)));
    }
    if (this.hp <= 0) this.die();
  }

  die() {
    if (this.dead) return;
    this.dead = true;
    game.score += this.score;
    game.player.kills++;
    if (game.player.lifesteal > 0) game.player.heal(game.player.lifesteal);
    for (let i = 0; i < 22; i++) {
      const a = rand(0, TAU); const sp = rand(1.5, 6);
      game.particles.push(new Particle(this.x, this.y, Math.cos(a) * sp, Math.sin(a) * sp, 35, '#aa3030', rand(1.8, 3.5)));
    }
    for (let i = 0; i < 7; i++) {
      const a = rand(0, TAU);
      game.particles.push(new Particle(this.x, this.y, Math.cos(a) * rand(0.3, 1.5), Math.sin(a) * rand(0.3, 1.5) - 0.8, 45, '#555560', rand(2, 3.5), 'smoke'));
    }
    if (game.player.hasShock) {
      game.shockwaves.push({ x: this.x, y: this.y, r: 5, maxR: 85, life: 16, damaging: true, damage: 35, hit: new Set() });
    }
    const xpOrbCount = Math.min(5, Math.ceil(this.xp / 8));
    const xpPerOrb = this.xp / xpOrbCount;
    for (let i = 0; i < xpOrbCount; i++) {
      const a = rand(0, TAU); const sp = rand(1, 3);
      game.orbs.push(new ExpOrb(this.x + rand(-5, 5), this.y + rand(-5, 5), Math.cos(a) * sp, Math.sin(a) * sp, xpPerOrb));
    }
    game.shake = Math.min(game.shake + 1.5, 8);
    addKillFeed(this.name, this.score);
    const r = Math.random();
    const luck = game.player.dropLuck;
    if (r < 0.05 * luck) {
      const keys = WEAPON_KEYS.filter(k => k !== game.player.weaponKey);
      const w = keys[Math.floor(Math.random() * keys.length)];
      game.drops.push(new Drop(this.x, this.y, 'weapon', w));
    } else if (r < 0.18 * luck) {
      game.drops.push(new Drop(this.x, this.y, 'ammo', null));
    } else if (r < 0.26 * luck) {
      game.drops.push(new Drop(this.x, this.y, 'health', null));
    }
  }

  draw() {
    if (this.spawnAnim > 0) {
      const t = 1 - this.spawnAnim / 18;
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.globalAlpha = t;
      ctx.strokeStyle = this.accent;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, 0, this.radius * (2 - t), 0, TAU);
      ctx.stroke();
      ctx.restore();
      return;
    }

    ctx.save();
    ctx.translate(this.x, this.y);
    // 阴影
    ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
    ctx.beginPath();
    ctx.ellipse(0, 6, this.radius * 0.95, this.radius * 0.32, 0, 0, TAU);
    ctx.fill();

    // 减速光环
    if (this.slow > 0) {
      ctx.strokeStyle = 'rgba(74, 212, 240, 0.35)';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0, 0, this.radius + 3, 0, TAU); ctx.stroke();
    }
    if (this.poisonStacks > 0) {
      ctx.strokeStyle = 'rgba(74, 220, 90, 0.35)';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(0, 0, this.radius + 5, 0, TAU); ctx.stroke();
    }

    ctx.rotate(this.angle);
    const flashing = this.hitFlash > 0;
    const vestColor = flashing ? '#ffffff' : this.color;
    const skinColor = flashing ? '#ffffff' : this.skin;

    // 狙击手激光
    if (this.sniper && this.fireTimer < 30 && this.fireTimer > 0) {
      const a = Math.sin(this.fireTimer * 0.5) * 0.5 + 0.5;
      ctx.strokeStyle = `rgba(255, 60, 60, ${a * 0.5})`;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(this.radius, 0);
      ctx.lineTo(this.range, 0);
      ctx.stroke();
    }

    // 武器（根据武器类型有不同长度）
    let gunLen = 18;
    if (this.weapon === 'rifle' || this.weapon === 'smg' || this.weapon === 'lmg') gunLen = 26;
    if (this.weapon === 'sniper') gunLen = 30;
    if (this.weapon === 'shotgun') gunLen = 22;
    if (this.weapon === 'knife') gunLen = 10;
    if (this.weapon === 'flamer') gunLen = 24;
    if (this.weapon !== 'none') {
      ctx.fillStyle = '#1a1a1a';
      ctx.fillRect(this.radius - 2, -2.5, gunLen, 5);
      ctx.fillStyle = '#0a0a0a';
      ctx.fillRect(this.radius + gunLen - 4, -2, 4, 4);
    }

    // 自爆兵的炸药包
    if (this.shape === 'human_bomb') {
      ctx.fillStyle = '#1a1a1a';
      ctx.fillRect(-this.radius * 0.5, -this.radius * 0.5, this.radius, this.radius);
      // 闪烁
      const pulse = 0.5 + 0.5 * Math.sin(game.time * 0.4);
      ctx.fillStyle = `rgba(255, 200, 60, ${pulse})`;
      ctx.beginPath();
      ctx.arc(0, 0, 3, 0, TAU);
      ctx.fill();
    }

    // 身体
    if (this.shape === 'human_heavy') {
      // 重装兵：方形大块防弹衣
      ctx.fillStyle = vestColor;
      ctx.fillRect(-this.radius * 0.9, -this.radius * 0.85, this.radius * 1.8, this.radius * 1.7);
      // 装甲条纹
      ctx.fillStyle = '#1a1a2a';
      ctx.fillRect(-this.radius * 0.9, -this.radius * 0.3, this.radius * 1.8, this.radius * 0.25);
      ctx.fillRect(-this.radius * 0.9, this.radius * 0.15, this.radius * 1.8, this.radius * 0.25);
      // 核心
      ctx.fillStyle = this.accent;
      ctx.beginPath(); ctx.arc(0, 0, 3, 0, TAU); ctx.fill();
    } else {
      // 普通：椭圆身体
      ctx.fillStyle = vestColor;
      ctx.beginPath();
      ctx.ellipse(0, 0, this.radius * 0.78, this.radius * 0.88, 0, 0, TAU);
      ctx.fill();
      // 防弹衣条纹
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.fillRect(-this.radius * 0.6, -2, this.radius * 1.2, 3);
    }

    // 盾牌兵的盾
    if (this.shape === 'human_shield') {
      ctx.fillStyle = '#1a3a6a';
      ctx.fillRect(this.radius - 2, -this.radius - 1, 5, this.radius * 2 + 2);
      ctx.strokeStyle = this.accent;
      ctx.lineWidth = 1;
      ctx.strokeRect(this.radius - 2, -this.radius - 1, 5, this.radius * 2 + 2);
    }

    // 医疗兵的十字
    if (this.shape === 'human_medic') {
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(-3, -this.radius * 0.4, 6, this.radius * 0.8);
      ctx.fillRect(-this.radius * 0.4, -3, this.radius * 0.8, 6);
    }

    // 头部
    ctx.fillStyle = skinColor;
    ctx.beginPath();
    ctx.arc(0, 0, this.radius * 0.5, 0, TAU);
    ctx.fill();
    // 头盔/帽子（顶半圆）
    ctx.fillStyle = vestColor;
    ctx.beginPath();
    ctx.arc(0, 0, this.radius * 0.5, Math.PI, TAU);
    ctx.fill();
    // 头盔条
    ctx.fillStyle = this.accent;
    ctx.fillRect(-this.radius * 0.5, -this.radius * 0.5, this.radius, 1.2);

    ctx.restore();

    // 血条
    if (this.hp < this.maxHp && this.spawnAnim === 0) {
      const bw = this.radius * 2.2;
      const bx = this.x - bw / 2;
      const by = this.y - this.radius - 8;
      ctx.fillStyle = 'rgba(0,0,0,0.7)';
      ctx.fillRect(bx - 1, by - 1, bw + 2, 3);
      ctx.fillStyle = this.color;
      ctx.fillRect(bx, by, bw * (this.hp / this.maxHp), 1.5);
    }
  }
}

// ===================== 子弹 =====================
class Bullet {
  constructor(x, y, angle, opts, owner) {
    this.x = x; this.y = y;
    this.vx = Math.cos(angle) * opts.bulletSpeed;
    this.vy = Math.sin(angle) * opts.bulletSpeed;
    this.angle = angle;
    this.baseSpeed = opts.bulletSpeed;
    this.damage = opts.damage;
    this.color = opts.color;
    this.glow = opts.glow || opts.color;
    this.size = opts.size || 3;
    this.life = opts.life || 60;
    this.owner = owner;
    this.pierce = opts.pierce || 0;
    this.bounce = opts.bounce || 0;
    this.homing = opts.homing || false;
    this.boomerang = opts.boomerang || false;
    this.split = opts.split || false;
    this.shock = opts.shock || false;
    this.chain = opts.chain || false;
    this.poison = opts.poison || false;
    this.freeze = opts.freeze || false;
    this.hitEnemies = new Set();
    this.dead = false;
    this.trail = [];
    this.crit = false;
    this.maxDist = 500;
    this.distTraveled = 0;
    this.returning = false;
  }

  update() {
    this.trail.push({ x: this.x, y: this.y });
    if (this.trail.length > 6) this.trail.shift();

    if (this.homing && this.owner === 'player') {
      let nearest = null, nd = Infinity;
      for (const e of game.enemies) {
        if (e.dead || e.spawnAnim > 0) continue;
        const d = dist(this, e);
        if (d < nd && d < 180) { nd = d; nearest = e; }
      }
      if (nearest) {
        const targetAngle = Math.atan2(nearest.y - this.y, nearest.x - this.x);
        const cur = Math.atan2(this.vy, this.vx);
        let diff = targetAngle - cur;
        while (diff > Math.PI) diff -= TAU;
        while (diff < -Math.PI) diff += TAU;
        const newAngle = cur + clamp(diff, -0.18, 0.18);
        this.vx = Math.cos(newAngle) * this.baseSpeed;
        this.vy = Math.sin(newAngle) * this.baseSpeed;
      }
    }
    if (this.boomerang && this.owner === 'player') {
      if (!this.returning) {
        this.distTraveled += this.baseSpeed;
        if (this.distTraveled > this.maxDist) this.returning = true;
      } else {
        const targetAngle = Math.atan2(game.player.y - this.y, game.player.x - this.x);
        const cur = Math.atan2(this.vy, this.vx);
        let diff = targetAngle - cur;
        while (diff > Math.PI) diff -= TAU;
        while (diff < -Math.PI) diff += TAU;
        const newAngle = cur + clamp(diff, -0.2, 0.2);
        this.vx = Math.cos(newAngle) * this.baseSpeed;
        this.vy = Math.sin(newAngle) * this.baseSpeed;
        if (dist(this, game.player) < 20) this.dead = true;
      }
    }

    this.x += this.vx;
    this.y += this.vy;
    this.life--;

    if (this.bounce > 0) {
      if (this.x < 0 || this.x > canvas.width) { this.vx = -this.vx; this.bounce--; }
      if (this.y < 0 || this.y > canvas.height) { this.vy = -this.vy; this.bounce--; }
    }

    if (this.life <= 0 || this.x < -80 || this.x > canvas.width + 80 || this.y < -80 || this.y > canvas.height + 80) {
      this.dead = true; return;
    }

    if (this.owner === 'player') {
      for (const e of game.enemies) {
        if (e.dead || e.spawnAnim > 0) continue;
        if (this.hitEnemies.has(e)) continue;
        if (dist(this, e) < e.radius + this.size) {
          this.onHitEnemy(e);
          if (this.pierce <= 0) { this.dead = true; break; }
          else this.pierce--;
        }
      }
    } else if (this.owner === 'enemy') {
      const p = game.player;
      if (dist(this, p) < p.radius + this.size) {
        p.takeDamage(this.damage); this.dead = true;
        for (let i = 0; i < 5; i++) {
          const a = rand(0, TAU); const sp = rand(1, 2.5);
          game.particles.push(new Particle(this.x, this.y, Math.cos(a) * sp, Math.sin(a) * sp, 12, this.glow, rand(1, 2)));
        }
      }
    }
  }

  onHitEnemy(e) {
    e.takeDamage(this.damage);
    this.hitEnemies.add(e);
    if (this.poison) { e.poisonStacks = Math.min(5, e.poisonStacks + 1); e.poisonTimer = 30; }
    if (this.freeze) e.slow = 90;
    if (this.split && !this.splitTriggered) {
      this.splitTriggered = true;
      for (let i = 0; i < 2; i++) {
        const a = this.angle + (i === 0 ? Math.PI / 3 : -Math.PI / 3);
        const b = new Bullet(this.x, this.y, a, {
          damage: this.damage * 0.5, color: this.color, glow: this.glow,
          bulletSpeed: this.baseSpeed, size: this.size * 0.8, life: 35
        }, 'player');
        game.bullets.push(b);
      }
    }
    if (this.chain && !this.chainTriggered) {
      this.chainTriggered = true;
      let nearest = null, nd = Infinity;
      for (const e2 of game.enemies) {
        if (e2 === e || e2.dead || e2.spawnAnim > 0) continue;
        const d = dist(this, e2);
        if (d < nd && d < 140) { nd = d; nearest = e2; }
      }
      if (nearest) {
        nearest.takeDamage(this.damage * 0.6);
        game.lightnings.push({ x1: this.x, y1: this.y, x2: nearest.x, y2: nearest.y, life: 7 });
      }
    }
    for (let i = 0; i < 4; i++) {
      const a = rand(0, TAU); const sp = rand(1, 2.5);
      game.particles.push(new Particle(this.x, this.y, Math.cos(a) * sp, Math.sin(a) * sp, 12, this.glow, rand(1, 2.2)));
    }
  }

  draw() {
    // 拖尾
    for (let i = 0; i < this.trail.length; i++) {
      const t = this.trail[i];
      const a = i / this.trail.length;
      ctx.globalAlpha = a * 0.35;
      ctx.fillStyle = this.color;
      ctx.beginPath();
      ctx.arc(t.x, t.y, Math.max(0.5, this.size * a * 0.7), 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    // 子弹主体
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, TAU);
    ctx.fill();
    if (this.crit) {
      ctx.strokeStyle = '#ff5252'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(this.x, this.y, this.size + 2, 0, TAU); ctx.stroke();
    }
  }
}

// ===================== 粒子 =====================
class Particle {
  constructor(x, y, vx, vy, life, color, size, type) {
    this.x = x; this.y = y; this.vx = vx; this.vy = vy;
    this.life = life; this.maxLife = life;
    this.color = color; this.size = size;
    this.type = type || 'normal';
    this.dead = false;
    this.rotation = rand(0, TAU);
    this.rotSpeed = rand(-0.2, 0.2);
  }
  update() {
    this.x += this.vx; this.y += this.vy;
    if (this.type === 'shell') { this.vy += 0.18; this.vx *= 0.98; this.rotation += this.rotSpeed; }
    else if (this.type === 'smoke') { this.vx *= 0.95; this.vy *= 0.95; this.vy -= 0.05; }
    else if (this.type === 'flame') { this.vx *= 0.9; this.vy *= 0.9; this.vy -= 0.1; }
    else { this.vx *= 0.92; this.vy *= 0.92; }
    this.life--;
    if (this.life <= 0) this.dead = true;
  }
  draw() {
    const a = this.life / this.maxLife;
    if (this.type === 'shell') {
      ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.rotation);
      ctx.globalAlpha = a; ctx.fillStyle = this.color;
      ctx.fillRect(-2.2, -0.8, 4.4, 1.6);
      ctx.restore(); ctx.globalAlpha = 1;
    } else if (this.type === 'smoke') {
      ctx.globalAlpha = a * 0.35; ctx.fillStyle = this.color;
      ctx.beginPath(); ctx.arc(this.x, this.y, this.size * (2 - a), 0, TAU); ctx.fill();
      ctx.globalAlpha = 1;
    } else if (this.type === 'flame') {
      ctx.globalAlpha = a * 0.8; ctx.fillStyle = this.color;
      ctx.beginPath(); ctx.arc(this.x, this.y, this.size * (1.5 - a * 0.5), 0, TAU);
      ctx.fill(); ctx.globalAlpha = 1;
    } else {
      ctx.globalAlpha = a; ctx.fillStyle = this.color;
      ctx.beginPath(); ctx.arc(this.x, this.y, Math.max(0.5, this.size * a), 0, TAU); ctx.fill();
      ctx.globalAlpha = 1;
    }
  }
}

// ===================== 经验球 =====================
class ExpOrb {
  constructor(x, y, vx, vy, xp) {
    this.x = x; this.y = y; this.vx = vx; this.vy = vy;
    this.xp = xp; this.life = 600; this.dead = false;
    this.radius = 5; this.bob = rand(0, TAU);
  }
  update() {
    this.bob += 0.1; this.life--;
    if (this.life <= 0) { this.dead = true; return; }
    const p = game.player;
    const d = dist(this, p);
    const magnet = 70 * p.pickupRangeMult;
    if (d < magnet) {
      const ang = Math.atan2(p.y - this.y, p.x - this.x);
      const force = (1 - d / magnet) * 0.9;
      this.vx += Math.cos(ang) * force;
      this.vy += Math.sin(ang) * force;
    }
    this.vx *= 0.92; this.vy *= 0.92;
    this.x += this.vx; this.y += this.vy;
    if (d < p.radius + this.radius) {
      p.addXP(this.xp); this.dead = true;
      for (let i = 0; i < 3; i++) {
        const a = rand(0, TAU);
        game.particles.push(new Particle(this.x, this.y, Math.cos(a) * 1.5, Math.sin(a) * 1.5, 14, '#ffb800', rand(1.5, 2.2)));
      }
    }
  }
  draw() {
    const bob = Math.sin(this.bob) * 2;
    if (this.life < 60 && Math.floor(this.life / 6) % 2 === 0) return;
    const r = this.radius + bob * 0.2;
    ctx.fillStyle = 'rgba(255, 184, 0, 0.18)';
    ctx.beginPath(); ctx.arc(this.x, this.y + bob, r * 2, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ffb800';
    ctx.beginPath(); ctx.arc(this.x, this.y + bob, r, 0, TAU); ctx.fill();
    ctx.fillStyle = '#fff8cc';
    ctx.beginPath(); ctx.arc(this.x - 1, this.y + bob - 1, r * 0.4, 0, TAU); ctx.fill();
  }
}

// ===================== 地面物品 =====================
class Drop {
  constructor(x, y, kind, data) {
    this.x = x; this.y = y; this.kind = kind; this.data = data;
    this.life = 600; this.bob = rand(0, TAU); this.dead = false;
    this.radius = 14; this.spawnAnim = 12;
  }
  get color() { return this.kind === 'weapon' ? '#ff44aa' : (this.kind === 'ammo' ? '#d4a017' : '#4ad45a'); }
  update() {
    if (this.spawnAnim > 0) this.spawnAnim--;
    this.bob += 0.06; this.life--;
    if (this.life <= 0) { this.dead = true; return; }
    const p = game.player;
    if (dist(this, p) < this.radius + p.radius + 4) this.pickup();
  }
  pickup() {
    this.dead = true;
    if (this.kind === 'weapon') {
      game.player.weaponKey = this.data;
      game.player.ammo = game.player.effectiveMag;
      game.player.reloadTimer = 0; game.player.fireTimer = 0;
      for (let i = 0; i < 18; i++) {
        const a = rand(0, TAU); const sp = rand(2, 5);
        game.particles.push(new Particle(this.x, this.y, Math.cos(a) * sp, Math.sin(a) * sp, 25, this.color, rand(1.8, 3)));
      }
      showFloater(this.x, this.y, WEAPONS[this.data].name, this.color);
    } else if (this.kind === 'ammo') {
      game.player.ammo = game.player.effectiveMag; game.player.reloadTimer = 0;
      for (let i = 0; i < 12; i++) {
        const a = rand(0, TAU); const sp = rand(1.5, 3);
        game.particles.push(new Particle(this.x, this.y, Math.cos(a) * sp, Math.sin(a) * sp, 20, this.color, rand(1.5, 2.2)));
      }
      showFloater(this.x, this.y, '弹药', this.color);
    } else if (this.kind === 'health') {
      game.player.heal(35);
      showFloater(this.x, this.y, '+35 HP', this.color);
    }
  }
  draw() {
    const bob = Math.sin(this.bob) * 3;
    if (this.life < 120 && Math.floor(this.life / 8) % 2 === 0) return;
    const scale = this.spawnAnim > 0 ? (1 - this.spawnAnim / 12) : 1;
    ctx.save();
    ctx.translate(this.x, this.y + bob);
    ctx.scale(scale, scale);
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.beginPath(); ctx.ellipse(0, 8 - bob, this.radius * 0.8, this.radius * 0.3, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#1a1d23';
    ctx.fillRect(-this.radius, -this.radius, this.radius * 2, this.radius * 2);
    ctx.strokeStyle = this.color; ctx.lineWidth = 2;
    ctx.strokeRect(-this.radius, -this.radius, this.radius * 2, this.radius * 2);
    ctx.fillStyle = this.color;
    ctx.fillRect(-this.radius, -this.radius, 4, 4);
    ctx.fillRect(this.radius - 4, -this.radius, 4, 4);
    ctx.font = 'bold 13px Noto Sans SC';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    let icon = '?';
    if (this.kind === 'weapon') icon = 'W';
    else if (this.kind === 'ammo') icon = 'A';
    else if (this.kind === 'health') icon = '+';
    ctx.fillText(icon, 0, 1);
    ctx.restore();
  }
}

// ===================== 箱子 =====================
class Crate {
  constructor(x, y, type) {
    this.x = x; this.y = y; this.type = type;
    this.life = 1800; this.radius = 20;
    this.bob = rand(0, TAU); this.dead = false;
  }
  get color() { return this.type === 'weapon' ? '#d4a017' : '#b347d9'; }
  update() {
    this.bob += 0.04; this.life--;
    if (this.life <= 0) { this.dead = true; return; }
    const p = game.player;
    if (dist(this, p) < this.radius + p.radius) this.open();
  }
  open() {
    this.dead = true;
    const flash = document.getElementById('pickup-flash');
    flash.classList.remove('show'); void flash.offsetWidth;
    flash.classList.add('show');
    setTimeout(() => flash.classList.remove('show'), 500);
    if (this.type === 'weapon') {
      game.player.upgradeWeapon();
      showFloater(this.x, this.y - 20, '武器升级', '#d4a017');
      showFloater(this.x, this.y, WEAPONS[game.player.weaponKey].name + ' T' + game.player.weaponTier, '#ffd84a');
    } else {
      const owned = Array.from(game.player.skills);
      const available = SKILLS.filter(s => !owned.includes(s.id));
      let skill;
      if (available.length === 0) {
        skill = SKILLS[Math.floor(Math.random() * SKILLS.length)];
        showFloater(this.x, this.y - 20, '技能强化', '#b347d9');
      } else {
        skill = available[Math.floor(Math.random() * available.length)];
        game.player.addSkill(skill.id);
        showFloater(this.x, this.y - 20, '获得技能', '#b347d9');
      }
      showFloater(this.x, this.y, skill.name, skill.color);
      updateSkillsHUD();
    }
    for (let i = 0; i < 26; i++) {
      const a = rand(0, TAU); const sp = rand(2, 6);
      game.particles.push(new Particle(this.x, this.y, Math.cos(a) * sp, Math.sin(a) * sp, 35, this.color, rand(1.8, 3.5)));
    }
    game.shockwaves.push({ x: this.x, y: this.y, r: 5, maxR: 70, life: 14 });
    game.shake = Math.min(game.shake + 3, 8);
  }
  draw() {
    const bob = Math.sin(this.bob) * 3;
    if (this.life < 300 && Math.floor(this.life / 10) % 2 === 0) return;
    ctx.save();
    ctx.translate(this.x, this.y + bob);
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.beginPath(); ctx.ellipse(0, 12 - bob, this.radius * 1.1, this.radius * 0.4, 0, 0, TAU); ctx.fill();
    // 光柱
    const gradV = ctx.createLinearGradient(0, -100, 0, 0);
    gradV.addColorStop(0, 'rgba(0,0,0,0)');
    gradV.addColorStop(1, this.color + '44');
    ctx.fillStyle = gradV;
    ctx.fillRect(-this.radius * 0.5, -100, this.radius, 100);
    // 箱体
    ctx.fillStyle = '#1a1d23';
    ctx.fillRect(-this.radius, -this.radius, this.radius * 2, this.radius * 2);
    ctx.strokeStyle = this.color; ctx.lineWidth = 3;
    ctx.strokeRect(-this.radius, -this.radius, this.radius * 2, this.radius * 2);
    // 四角
    ctx.fillStyle = this.color;
    const cs = 6;
    ctx.fillRect(-this.radius, -this.radius, cs, cs);
    ctx.fillRect(this.radius - cs, -this.radius, cs, cs);
    ctx.fillRect(-this.radius, this.radius - cs, cs, cs);
    ctx.fillRect(this.radius - cs, this.radius - cs, cs, cs);
    // 标签
    ctx.fillStyle = this.color;
    ctx.font = 'bold 11px Noto Sans SC';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(this.type === 'weapon' ? '武器' : '技能', 0, -2);
    ctx.font = 'bold 16px JetBrains Mono';
    ctx.fillText(this.type === 'weapon' ? '★' : '◈', 0, 10);
    // 脉冲光环
    const pulse = 0.4 + 0.4 * Math.sin(game.time * 0.08);
    ctx.strokeStyle = this.color + Math.floor(pulse * 255).toString(16).padStart(2, '0');
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(0, 0, this.radius + 8 + pulse * 4, 0, TAU); ctx.stroke();
    ctx.restore();
  }
}

const floaters = [];
function showFloater(x, y, text, color) {
  floaters.push({ x, y, text: String(text), life: 45, maxLife: 45, vy: -1.4, color, size: 13 });
}
function updateFloaters() {
  for (let i = floaters.length - 1; i >= 0; i--) {
    const f = floaters[i];
    f.y += f.vy; f.vy *= 0.96; f.life--;
    if (f.life <= 0) floaters.splice(i, 1);
  }
}
function drawFloaters() {
  for (const f of floaters) {
    const a = f.life / f.maxLife;
    ctx.globalAlpha = a; ctx.fillStyle = f.color;
    ctx.font = `900 ${f.size || 13}px Noto Sans SC`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
}

// ===================== 触屏控制 =====================
const touchState = {
  move: { active: false, id: null, startX: 0, startY: 0, dx: 0, dy: 0 },
  aim: { active: false, id: null, startX: 0, startY: 0, dx: 0, dy: 0 }
};

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  for (const touch of e.changedTouches) {
    const x = touch.clientX;
    const y = touch.clientY;
    const halfW = window.innerWidth / 2;
    if (x < halfW && !touchState.move.active) {
      touchState.move.active = true;
      touchState.move.id = touch.identifier;
      touchState.move.startX = x; touchState.move.startY = y;
      touchState.move.dx = 0; touchState.move.dy = 0;
      showJoystick('move', x, y);
    } else if (x >= halfW && !touchState.aim.active) {
      touchState.aim.active = true;
      touchState.aim.id = touch.identifier;
      touchState.aim.startX = x; touchState.aim.startY = y;
      touchState.aim.dx = 0; touchState.aim.dy = 0;
      game.mouse.down = true;
      showJoystick('aim', x, y);
    }
  }
}, { passive: false });

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  for (const touch of e.changedTouches) {
    if (touch.identifier === touchState.move.id) {
      touchState.move.dx = touch.clientX - touchState.move.startX;
      touchState.move.dy = touch.clientY - touchState.move.startY;
      updateJoystick('move', touch.clientX, touch.clientY);
    } else if (touch.identifier === touchState.aim.id) {
      touchState.aim.dx = touch.clientX - touchState.aim.startX;
      touchState.aim.dy = touch.clientY - touchState.aim.startY;
      updateJoystick('aim', touch.clientX, touch.clientY);
    }
  }
}, { passive: false });

function endTouch(e) {
  for (const touch of e.changedTouches) {
    if (touch.identifier === touchState.move.id) {
      touchState.move.active = false; touchState.move.id = null;
      touchState.move.dx = 0; touchState.move.dy = 0;
      hideJoystick('move');
    } else if (touch.identifier === touchState.aim.id) {
      touchState.aim.active = false; touchState.aim.id = null;
      game.mouse.down = false;
      hideJoystick('aim');
    }
  }
}
canvas.addEventListener('touchend', e => { e.preventDefault(); endTouch(e); }, { passive: false });
canvas.addEventListener('touchcancel', e => { e.preventDefault(); endTouch(e); }, { passive: false });

// 虚拟摇杆显示
const mobileUI = document.getElementById('mobile-ui');
let joystickElements = {};
function showJoystick(side, x, y) {
  if (!isTouch) return;
  let base = joystickElements[side + 'Base'];
  let stick = joystickElements[side + 'Stick'];
  if (!base) {
    base = document.createElement('div');
    base.className = 'joystick-base' + (side === 'aim' ? ' right' : '');
    mobileUI.appendChild(base);
    joystickElements[side + 'Base'] = base;
  }
  if (!stick) {
    stick = document.createElement('div');
    stick.className = 'joystick-stick' + (side === 'aim' ? ' right' : '');
    mobileUI.appendChild(stick);
    joystickElements[side + 'Stick'] = stick;
  }
  base.style.left = (x - 60) + 'px';
  base.style.top = (y - 60) + 'px';
  base.style.display = 'block';
  stick.style.left = (x - 25) + 'px';
  stick.style.top = (y - 25) + 'px';
  stick.style.display = 'block';
}
function updateJoystick(side, x, y) {
  const stick = joystickElements[side + 'Stick'];
  if (!stick) return;
  let dx = side === 'move' ? touchState.move.dx : touchState.aim.dx;
  let dy = side === 'move' ? touchState.move.dy : touchState.aim.dy;
  const len = Math.hypot(dx, dy);
  const max = 40;
  if (len > max) { dx = dx / len * max; dy = dy / len * max; }
  const baseX = side === 'move' ? touchState.move.startX : touchState.aim.startX;
  const baseY = side === 'move' ? touchState.move.startY : touchState.aim.startY;
  stick.style.left = (baseX + dx - 25) + 'px';
  stick.style.top = (baseY + dy - 25) + 'px';
}
function hideJoystick(side) {
  if (joystickElements[side + 'Base']) joystickElements[side + 'Base'].style.display = 'none';
  if (joystickElements[side + 'Stick']) joystickElements[side + 'Stick'].style.display = 'none';
}
