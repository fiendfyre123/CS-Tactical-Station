// ===================== Game 状态 =====================
const game = {
  state: 'menu',
  player: null,
  enemies: [], bullets: [], particles: [], drops: [], orbs: [],
  shockwaves: [], lightnings: [], crates: [],
  score: 0, wave: 0,
  enemiesToSpawn: 0, spawnTimer: 0, waveTimer: 0,
  crateTimer: 600,
  shake: 0, time: 0,
  keys: {}, mouse: { x: 0, y: 0, down: false }
};

function startGame() {
  game.state = 'playing';
  game.player = new Player(canvas.width / 2, canvas.height / 2);
  game.enemies = []; game.bullets = []; game.particles = [];
  game.drops = []; game.orbs = []; game.shockwaves = [];
  game.lightnings = []; game.crates = [];
  game.score = 0; game.wave = 0;
  game.waveTimer = 0; game.shake = 0;
  game.mouse.down = false;
  floaters.length = 0;
  killfeed.innerHTML = '';
  document.getElementById('crate-hint').innerHTML = '';
  document.getElementById('menu').classList.add('hidden');
  document.getElementById('gameover').classList.add('hidden');
  document.getElementById('hud').classList.remove('hidden');
  document.getElementById('levelup').classList.add('hidden');
  if (!isTouch) document.body.style.cursor = 'none';
  else document.body.style.cursor = 'default';
  updateSkillsHUD();
  startWave();
}

function startWave() {
  game.wave++;
  // 【修改点 1】放缓数量增长曲线
  game.enemiesToSpawn = 5 + Math.floor(game.wave * 2 + game.wave * game.wave * 0.1);
  game.spawnTimer = 25;
  if (game.wave % 5 === 0) spawnCrate();
  if (game.wave % 3 === 0 && game.crates.length === 0) spawnCrate();
}

function spawnCrate() {
  let x, y, attempts = 0;
  do {
    x = rand(80, canvas.width - 80);
    y = rand(80, canvas.height - 80);
    attempts++;
  } while (attempts < 20 && dist({ x, y }, game.player) < 250);
  const type = Math.random() < 0.5 ? 'weapon' : 'skill';
  game.crates.push(new Crate(x, y, type));
  const hint = document.getElementById('crate-hint');
  const item = document.createElement('div');
  item.className = 'crate-item ' + type;
  item.innerHTML = `${type === 'weapon' ? '武器箱' : '技能箱'}<span class="dist">已刷新</span>`;
  hint.appendChild(item);
  setTimeout(() => item.classList.add('fade'), 3500);
  setTimeout(() => item.remove(), 4000);
}

function spawnEnemy() {
  const margin = 50;
  const side = Math.floor(Math.random() * 4);
  let x, y;
  if (side === 0) { x = Math.random() * canvas.width; y = -margin; }
  else if (side === 1) { x = canvas.width + margin; y = Math.random() * canvas.height; }
  else if (side === 2) { x = Math.random() * canvas.width; y = canvas.height + margin; }
  else { x = -margin; y = Math.random() * canvas.height; }

  const pool = ['grunt'];
  if (game.wave >= 2) pool.push('runner', 'shooter');
  if (game.wave >= 3) pool.push('rifleman');
  if (game.wave >= 4) pool.push('bomber', 'smg_gunner');
  if (game.wave >= 5) pool.push('shielder', 'shotgunner');
  if (game.wave >= 6) pool.push('sniper');
  if (game.wave >= 7) pool.push('heavy');
  if (game.wave >= 8) pool.push('medic', 'flamer');
  if (game.wave >= 5) pool.push('runner', 'shooter', 'rifleman');
  if (game.wave >= 8) pool.push('heavy', 'sniper', 'shielder', 'flamer');
  if (game.wave >= 12) pool.push('heavy', 'sniper', 'medic', 'flamer', 'shotgunner');

  const type = pool[Math.floor(Math.random() * pool.length)];
  const e = new Enemy(x, y, type, game.wave);
  game.enemies.push(e);
}

function gameOver() {
  game.state = 'gameover';
  document.getElementById('final-score').textContent = game.score;
  document.getElementById('final-wave').textContent = game.wave;
  document.getElementById('final-lvl').textContent = game.player.level;
  document.getElementById('final-kills').textContent = game.player.kills;
  document.getElementById('gameover').classList.remove('hidden');
  document.getElementById('hud').classList.add('hidden');
  document.body.style.cursor = 'default';
}

// ===================== 升级 =====================
function triggerLevelUp() {
  game.state = 'leveling';
  game.mouse.down = false;
  const flash = document.getElementById('pickup-flash');
  flash.classList.remove('show'); void flash.offsetWidth;
  flash.classList.add('show');
  setTimeout(() => flash.classList.remove('show'), 500);
  const taken = game.player.takenUpgrades;
  const pool = UPGRADES.map(u => ({
    u, w: (taken[u.id] || 0) >= 3 ? 0.1 : (taken[u.id] || 0) >= 1 ? 0.5 : 1
  })).filter(x => x.w > 0);
  const chosen = [];
  const tempPool = [...pool];
  for (let i = 0; i < 3 && tempPool.length > 0; i++) {
    const total = tempPool.reduce((s, x) => s + x.w, 0);
    let r = Math.random() * total;
    let idx = 0;
    for (let j = 0; j < tempPool.length; j++) {
      r -= tempPool[j].w;
      if (r <= 0) { idx = j; break; }
    }
    chosen.push(tempPool[idx].u);
    tempPool.splice(idx, 1);
  }
  const container = document.getElementById('upgrade-cards');
  container.innerHTML = '';
  document.getElementById('lv-tag').textContent = '升级';
  document.getElementById('lv-title').textContent = '等级 ' + game.player.level;
  document.getElementById('lv-sub').textContent = '选择一项强化部署';
  chosen.forEach(u => {
    const card = document.createElement('div');
    card.className = 'upgrade-card ' + u.rarity;
    const count = taken[u.id] || 0;
    card.innerHTML = `
      <div class="uc-rarity">${u.rarity === 'common' ? '普通' : u.rarity === 'rare' ? '稀有' : u.rarity === 'epic' ? '史诗' : '传说'}</div>
      <div class="uc-icon"><span>${u.icon}</span></div>
      <div class="uc-name">${u.name}</div>
      <div class="uc-desc">${u.desc.replace(/\n/g, '<br>')}</div>
      <div class="uc-stack">${count > 0 ? '已拥有 x' + count : '新'}</div>
    `;
    card.onclick = () => selectUpgrade(u);
    container.appendChild(card);
  });
  document.getElementById('levelup').classList.remove('hidden');
  document.body.style.cursor = 'default';
}

function selectUpgrade(u) {
  u.apply(game.player);
  game.player.takenUpgrades[u.id] = (game.player.takenUpgrades[u.id] || 0) + 1;
  document.getElementById('levelup').classList.add('hidden');
  if (!isTouch) document.body.style.cursor = 'none';
  game.state = 'playing';
}

function updateSkillsHUD() {
  const row = document.getElementById('skills-row');
  row.innerHTML = '';
  if (!game.player) return;
  for (const id of game.player.skills) {
    const s = SKILLS.find(x => x.id === id);
    if (!s) continue;
    const chip = document.createElement('div');
    chip.className = 'skill-chip ' + s.rarity;
    chip.textContent = s.name;
    row.appendChild(chip);
  }
  document.getElementById('weapon-upgrades').textContent = '等级 ' + game.player.weaponTier + ' / 5';
}

// ===================== 主循环 =====================
function update() {
  game.time++;
  if (game.state !== 'playing') return;
  game.player.update();
  for (let i = game.enemies.length - 1; i >= 0; i--) {
    game.enemies[i].update();
    if (game.enemies[i].dead) game.enemies.splice(i, 1);
  }
  for (let i = game.bullets.length - 1; i >= 0; i--) {
    game.bullets[i].update();
    if (game.bullets[i].dead) game.bullets.splice(i, 1);
  }
  for (let i = game.particles.length - 1; i >= 0; i--) {
    game.particles[i].update();
    if (game.particles[i].dead) game.particles.splice(i, 1);
  }
  if (game.particles.length > 700) game.particles.splice(0, game.particles.length - 700);
  for (let i = game.drops.length - 1; i >= 0; i--) {
    game.drops[i].update();
    if (game.drops[i].dead) game.drops.splice(i, 1);
  }
  for (let i = game.orbs.length - 1; i >= 0; i--) {
    game.orbs[i].update();
    if (game.orbs[i].dead) game.orbs.splice(i, 1);
  }
  for (let i = game.crates.length - 1; i >= 0; i--) {
    game.crates[i].update();
    if (game.crates[i].dead) game.crates.splice(i, 1);
  }
  for (let i = game.shockwaves.length - 1; i >= 0; i--) {
    const s = game.shockwaves[i];
    s.r += (s.maxR - s.r) * 0.2;
    s.life--;
    if (s.damaging) {
      for (const e of game.enemies) {
        if (e.dead || (s.hit && s.hit.has(e))) continue;
        if (dist(s, e) < s.r + e.radius && dist(s, e) > s.r - e.radius - 10) {
          e.takeDamage(s.damage);
          if (!s.hit) s.hit = new Set();
          s.hit.add(e);
        }
      }
    }
    if (s.life <= 0) game.shockwaves.splice(i, 1);
  }
  for (let i = game.lightnings.length - 1; i >= 0; i--) {
    game.lightnings[i].life--;
    if (game.lightnings[i].life <= 0) game.lightnings.splice(i, 1);
  }
  updateFloaters();

  // 敌人生成 - 降低批量与频率
  if (game.enemiesToSpawn > 0) {
    game.spawnTimer--;
    if (game.spawnTimer <= 0) {
      // 【修改点 2】减少单次批量，最多一次刷 3 只
      const batch = Math.min(game.enemiesToSpawn, 1 + Math.floor(game.wave / 5));
      for (let i = 0; i < batch; i++) spawnEnemy();
      game.enemiesToSpawn -= batch;
      // 【修改点 3】放缓生成间隔，最快 12 帧
      game.spawnTimer = Math.max(12, 50 - game.wave);
    }
  }

  // 箱子定期刷新
  if (!game.crateTimer) game.crateTimer = 600;
  game.crateTimer--;
  if (game.crateTimer <= 0 && game.crates.length < 2) {
    spawnCrate();
    game.crateTimer = 800 + Math.floor(Math.random() * 500);
  }

  // 波次推进
  if (game.enemiesToSpawn === 0 && game.enemies.length === 0) {
    if (game.waveTimer <= 0) game.waveTimer = 80;
    else {
      game.waveTimer--;
      if (game.waveTimer === 0) startWave();
    }
  }
  game.shake *= 0.85;
  if (game.shake < 0.1) game.shake = 0;
  updateHUD();
}

function render() {
  ctx.save();
  if (game.shake > 0.1) ctx.translate(rand(-game.shake, game.shake), rand(-game.shake, game.shake));

  // 拖尾
  ctx.fillStyle = 'rgba(13, 12, 10, 0.4)';
  ctx.fillRect(-50, -50, canvas.width + 100, canvas.height + 100);
  drawBackground();

  // 冲击波
  for (const s of game.shockwaves) {
    const a = s.life / 20;
    ctx.strokeStyle = `rgba(255, 120, 40, ${a})`;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, TAU); ctx.stroke();
    if (s.damaging) {
      ctx.strokeStyle = `rgba(255, 200, 100, ${a * 0.5})`;
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r - 5, 0, TAU); ctx.stroke();
    }
  }
  // 闪电
  for (const l of game.lightnings) {
    const a = l.life / 7;
    ctx.strokeStyle = `rgba(180, 100, 255, ${a})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(l.x1, l.y1);
    const segs = 6;
    for (let i = 1; i < segs; i++) {
      const t = i / segs;
      const x = l.x1 + (l.x2 - l.x1) * t + rand(-8, 8);
      const y = l.y1 + (l.y2 - l.y1) * t + rand(-8, 8);
      ctx.lineTo(x, y);
    }
    ctx.lineTo(l.x2, l.y2);
    ctx.stroke();
  }

  game.crates.forEach(c => c.draw());
  game.drops.forEach(d => d.draw());
  game.orbs.forEach(o => o.draw());

  if (game.state !== 'menu') {
    game.particles.filter(p => p.type === 'shell' || p.type === 'smoke').forEach(p => p.draw());
    game.particles.filter(p => p.type === 'flame').forEach(p => p.draw());
    game.particles.filter(p => p.type !== 'shell' && p.type !== 'smoke' && p.type !== 'flame').forEach(p => p.draw());
    game.bullets.forEach(b => b.draw());
    game.enemies.forEach(e => e.draw());
    if (game.player) game.player.draw();
    drawFloaters();
  }

  ctx.restore();
  if ((game.state === 'playing' || game.state === 'leveling') && !isTouch) drawCrosshair();
}

function drawBackground() {
  const size = 50;
  ctx.strokeStyle = 'rgba(74, 70, 50, 0.06)'; ctx.lineWidth = 1;
  for (let x = 0; x < canvas.width; x += size) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
  }
  for (let y = 0; y < canvas.height; y += size) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(74, 70, 50, 0.12)';
  for (let x = 0; x < canvas.width; x += size * 4) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
  }
  for (let y = 0; y < canvas.height; y += size * 4) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
  }
  if (game.player) {
    const grad = ctx.createRadialGradient(game.player.x, game.player.y, 0, game.player.x, game.player.y, 280);
    grad.addColorStop(0, 'rgba(106, 138, 170, 0.05)');
    grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }
}

function drawCrosshair() {
  const x = game.mouse.x, y = game.mouse.y;
  const firing = game.player && game.player.fireTimer > game.player.effectiveFireRate - 4;
  const baseColor = firing ? '#ffb800' : '#e4b041';
  const gap = firing ? 10 : 6;
  const size = 12;
  ctx.strokeStyle = baseColor; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x, y - gap); ctx.lineTo(x, y - gap - size);
  ctx.moveTo(x, y + gap); ctx.lineTo(x, y + gap + size);
  ctx.moveTo(x - gap, y); ctx.lineTo(x - gap - size, y);
  ctx.moveTo(x + gap, y); ctx.lineTo(x + gap + size, y);
  ctx.stroke();
  ctx.fillStyle = baseColor;
  ctx.beginPath(); ctx.arc(x, y, 1.3, 0, TAU); ctx.fill();
}

function updateHUD() {
  if (!game.player) return;
  const p = game.player;
  document.getElementById('score').textContent = game.score;
  document.getElementById('wave').textContent = game.wave;
  document.getElementById('enemies').textContent = game.enemies.length + game.enemiesToSpawn;
  document.getElementById('hp-text').textContent = Math.ceil(p.hp) + '/' + p.maxHp;
  document.getElementById('hp-fill').style.width = (p.hp / p.maxHp * 100) + '%';
  document.getElementById('lvl').textContent = p.level;
  document.getElementById('xp-text').textContent = p.xp + ' / ' + p.xpToNext;
  document.getElementById('xp-fill').style.width = (p.xp / p.xpToNext * 100) + '%';
  document.getElementById('weapon-name').textContent = p.weapon.name;
  document.getElementById('weapon-upgrades').textContent = '等级 ' + p.weaponTier + ' / 5';

  const ammoDisplay = document.getElementById('ammo-display');
  if (p.hasInfiniteAmmo) {
    ammoDisplay.innerHTML = '<span class="ammo-infinite">∞</span>';
  } else {
    ammoDisplay.innerHTML = '<span id="ammo-mag">' + p.ammo + '</span><span class="ammo-sep">/</span><span id="ammo-mag-max">' + p.effectiveMag + '</span>';
    const ammoEl = document.getElementById('ammo-mag');
    if (ammoEl) ammoEl.classList.toggle('ammo-low', p.ammo <= p.effectiveMag * 0.25);
  }
  document.getElementById('reload-hint').classList.toggle('show', p.reloadTimer > 0);

  // 箱子距离提示
  const hint = document.getElementById('crate-hint');
  const existingItems = hint.querySelectorAll('.crate-item:not(.fade)');
  if (existingItems.length === 0 && game.crates.length > 0) {
    for (const c of game.crates) {
      const d = Math.floor(dist(c, p) / 10);
      const item = document.createElement('div');
      item.className = 'crate-item ' + c.type;
      item.dataset.crateId = c.x + '_' + c.y;
      item.innerHTML = `${c.type === 'weapon' ? '武器箱' : '技能箱'}<span class="dist">${d}m</span>`;
      hint.appendChild(item);
    }
  } else {
    game.crates.forEach(c => {
      const items = hint.querySelectorAll('.crate-item:not(.fade)');
      items.forEach(item => {
        if (item.dataset.crateId == c.x + '_' + c.y) {
          const d = Math.floor(dist(c, p) / 10);
          item.querySelector('.dist').textContent = d + 'm';
        }
      });
    });
  }
  const allItems = hint.querySelectorAll('.crate-item:not(.fade)');
  allItems.forEach(item => {
    const id = item.dataset.crateId;
    const stillExists = game.crates.some(c => c.x + '_' + c.y == id);
    if (!stillExists) {
      item.classList.add('fade');
      setTimeout(() => item.remove(), 500);
    }
  });
}

function loop() {
  update();
  render();
  requestAnimationFrame(loop);
}

// 键盘
window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  game.keys[k] = true;
  if (k === 'r' && game.state === 'playing') game.player.startReload();
  if (k === ' ' && game.state === 'menu') startGame();
});
window.addEventListener('keyup', e => { game.keys[e.key.toLowerCase()] = false; });
window.addEventListener('mousemove', e => { game.mouse.x = e.clientX; game.mouse.y = e.clientY; });
window.addEventListener('mousedown', e => { if (e.button === 0 && game.state === 'playing' && !isTouch) game.mouse.down = true; });
window.addEventListener('mouseup', e => { if (e.button === 0) game.mouse.down = false; });
window.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('blur', () => { game.keys = {}; game.mouse.down = false; });

document.getElementById('start-btn').addEventListener('click', startGame);
document.getElementById('restart-btn').addEventListener('click', startGame);

loop();
</script>
